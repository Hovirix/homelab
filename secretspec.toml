[project]
name = "hx-lab"
revision = "1.0"

[providers]
production = "sops://secrets/production.sops.env?format=dotenv"

[profiles.production.defaults]
providers = ["production"]

[profiles.production]
AUTHENTIK_SECRET_KEY = { description = "Authentik secret key", type = "base64", generate = { bytes = 60 } }

AWS_ACCESS_KEY_ID = { description = "OpenTofu state backend access key" }
AWS_SECRET_ACCESS_KEY = { description = "OpenTofu state backend secret key" }

BORG_PASSPHRASE = { description = "Borg repository passphrase", type = "password", generate = { length = 32 } }

CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token" }
CLOUDFLARED_TUNNEL_TOKEN = { description = "Cloudflared tunnel token" }

GRAFANA_ADMIN_PASSWORD = { description = "Grafana admin password", type = "password", generate = { length = 32 } }
GRAFANA_CLIENT_ID = { description = "Grafana OAuth client ID", type = "uuid", generate = true }
GRAFANA_CLIENT_SECRET = { description = "Grafana OAuth client secret", type = "password", generate = { length = 64 } }
GRAFANA_SERVICE_ACCOUNT_TOKEN = { description = "Grafana Service Account Token" }

HCLOUD_TOKEN = { description = "Hetzner Cloud provider token" }
HETZNER_STORAGE_BOX_PASSWORD = { description = "Hetzner Storage Box password", type = "command", generate = { command = "printf 'Aa1!%s' \"$(openssl rand -hex 14)\"" } }

INCUS_CLIENT_CERT = { description = "Incus public client certificate (PEM)", as_path = true }
INCUS_CLIENT_KEY = { description = "Incus client private key (PEM)", as_path = true }
INCUS_ACME_TOKEN = { description = "Incus Cloudflare DNS challenge token" }

IMMICH_CLIENT_ID = { description = "Immich OAuth client ID", type = "uuid", generate = true }
IMMICH_CLIENT_SECRET = { description = "Immich OAuth client secret", type = "base64", generate = { bytes = 48 } }
IMMICH_CONFIG = { description = "Immich SSO-only configuration", composed = '''{"oauth":{"enabled":true,"autoLaunch":true,"autoRegister":true,"issuerUrl":"https://authentik.hovirix.dev/application/o/immich/","clientId":"${IMMICH_CLIENT_ID}","clientSecret":"${IMMICH_CLIENT_SECRET}","scope":"openid email profile immich","roleClaim":"immich_role","buttonText":"Login with Authentik"},"passwordLogin":{"enabled":false},"backup":{"database":{"enabled":false}},"server":{"externalDomain":"https://immich.hovirix.dev"}}''' }

MINIFLUX_CLIENT_ID = { description = "Miniflux OAuth client ID", type = "uuid", generate = true }
MINIFLUX_CLIENT_SECRET = { description = "Miniflux OAuth client secret", type = "password", generate = { length = 64 } }
MINIFLUX_DATABASE_URL = { description = "Miniflux PostgreSQL connection URL", composed = "postgresql://miniflux:${POSTGRES_MINIFLUX_PASSWORD}@postgres/miniflux?sslmode=disable" }

NTFY_AUTHENTIK_TOKEN = { description = "ntfy Authentik publisher token", type = "command", generate = { command = "printf 'tk_%s' \"$(openssl rand -hex 15 | cut -c1-29)\"" } }
NTFY_GRAFANA_TOKEN = { description = "ntfy Grafana publisher token", type = "command", generate = { command = "printf 'tk_%s' \"$(openssl rand -hex 15 | cut -c1-29)\"" } }
NTFY_READER_PASSWORD = { description = "ntfy reader password for phone and browser", type = "password", generate = { length = 32 } }
NTFY_DATABASE_URL = { description = "ntfy PostgreSQL connection URL", composed = "postgresql://ntfy:${POSTGRES_NTFY_PASSWORD}@postgres/ntfy?sslmode=disable" }
NTFY_WEB_PUSH_KEYS = { description = "ntfy browser push VAPID configuration", type = "command", generate = { command = "keys=\"$(ntfy webpush keys)\" && printf '%s\\n' \"$keys\" | sed -n '/^web-push-.*-key:/p'" } }

OPENTOFU_STATE_ENCRYPTION_PASSPHRASE = { description = "OpenTofu state encryption passphrase", type = "base64", generate = { bytes = 48 } }

PAPERLESS_ADMIN_EMAIL = { description = "Paperless admin email" }
PAPERLESS_ADMIN_PASSWORD = { description = "Paperless admin password", type = "password", generate = { length = 32 } }
PAPERLESS_ADMIN_USER = { description = "Paperless admin username" }
PAPERLESS_CLIENT_ID = { description = "Paperless OAuth client ID", type = "uuid", generate = true }
PAPERLESS_CLIENT_SECRET = { description = "Paperless OAuth client secret", type = "password", generate = { length = 64 } }
PAPERLESS_SECRET_KEY = { description = "Paperless secret key", type = "password", generate = { length = 64 } }

POSTGRES_AUTHENTIK_PASSWORD = { description = "Authentik PostgreSQL password", type = "base64", generate = { bytes = 36 } }
POSTGRES_GRAFANA_PASSWORD = { description = "Grafana PostgreSQL password", type = "base64", generate = { bytes = 36 } }
POSTGRES_IMMICH_PASSWORD = { description = "Immich PostgreSQL password", type = "base64", generate = { bytes = 36 } }
POSTGRES_MINIFLUX_PASSWORD = { description = "Miniflux PostgreSQL URL-safe password", type = "command", generate = { command = "printf '%s' \"$(openssl rand -hex 36)\"" } }
POSTGRES_NTFY_PASSWORD = { description = "ntfy PostgreSQL URL-safe password", type = "command", generate = { command = "printf '%s' \"$(openssl rand -hex 36)\"" } }
POSTGRES_EXPORTER_PASSWORD = { description = "PostgreSQL read-only monitoring password", type = "password", generate = { length = 32 } }
POSTGRES_PAPERLESS_PASSWORD = { description = "Paperless PostgreSQL password", type = "base64", generate = { bytes = 36 } }
POSTGRES_SUPERUSER_PASSWORD = { description = "PostgreSQL superuser password", type = "base64", generate = { bytes = 36 } }
POSTGRES_VAULTWARDEN_PASSWORD = { description = "Vaultwarden PostgreSQL URL-safe password", type = "command", generate = { command = "printf '%s' \"$(openssl rand -hex 36)\"" } }

TRAEFIK_CF_DNS_API_TOKEN = { description = "Traefik Cloudflare DNS API token" }

VAULTWARDEN_CLIENT_ID = { description = "Vaultwarden OAuth client ID", type = "uuid", generate = true }
VAULTWARDEN_CLIENT_SECRET = { description = "Vaultwarden OAuth client secret", type = "password", generate = { length = 64 } }
VAULTWARDEN_DATABASE_URL = { description = "Vaultwarden PostgreSQL connection URL", composed = "postgresql://vaultwarden:${POSTGRES_VAULTWARDEN_PASSWORD}@postgres/vaultwarden" }

TF_VAR_opentofu_state_encryption_passphrase = { description = "OpenTofu state encryption variable", composed = "${OPENTOFU_STATE_ENCRYPTION_PASSPHRASE}" }
TF_VAR_hetzner_storage_box_password = { description = "Hetzner Storage Box password variable", composed = "${HETZNER_STORAGE_BOX_PASSWORD}" }
TF_VAR_incus_acme_token = { description = "Incus Cloudflare DNS challenge token", composed = "${INCUS_ACME_TOKEN}" }

[scopes.incus]
secrets = ["INCUS_CLIENT_CERT", "INCUS_CLIENT_KEY"]

[scopes.incusos]
secrets = ["INCUS_CLIENT_CERT"]

[scopes.backup]
secrets = ["BORG_PASSPHRASE", "HETZNER_STORAGE_BOX_PASSWORD"]

[scopes.swarm]
secrets = [
  "AUTHENTIK_SECRET_KEY",
  "CLOUDFLARED_TUNNEL_TOKEN",
  "GRAFANA_ADMIN_PASSWORD",
  "GRAFANA_CLIENT_ID",
  "GRAFANA_CLIENT_SECRET",
  "IMMICH_CLIENT_ID",
  "IMMICH_CLIENT_SECRET",
  "IMMICH_CONFIG",
  "MINIFLUX_CLIENT_ID",
  "MINIFLUX_CLIENT_SECRET",
  "MINIFLUX_DATABASE_URL",
  "NTFY_AUTHENTIK_TOKEN",
  "NTFY_GRAFANA_TOKEN",
  "NTFY_READER_PASSWORD",
  "NTFY_DATABASE_URL",
  "NTFY_WEB_PUSH_KEYS",
  "PAPERLESS_ADMIN_EMAIL",
  "PAPERLESS_ADMIN_PASSWORD",
  "PAPERLESS_ADMIN_USER",
  "PAPERLESS_CLIENT_ID",
  "PAPERLESS_CLIENT_SECRET",
  "PAPERLESS_SECRET_KEY",
  "POSTGRES_AUTHENTIK_PASSWORD",
  "POSTGRES_GRAFANA_PASSWORD",
  "POSTGRES_IMMICH_PASSWORD",
  "POSTGRES_MINIFLUX_PASSWORD",
  "POSTGRES_NTFY_PASSWORD",
  "POSTGRES_EXPORTER_PASSWORD",
  "POSTGRES_PAPERLESS_PASSWORD",
  "POSTGRES_SUPERUSER_PASSWORD",
  "POSTGRES_VAULTWARDEN_PASSWORD",
  "TRAEFIK_CF_DNS_API_TOKEN",
  "VAULTWARDEN_CLIENT_ID",
  "VAULTWARDEN_CLIENT_SECRET",
  "VAULTWARDEN_DATABASE_URL",
]

[scopes.opencode]
secrets = ["GRAFANA_SERVICE_ACCOUNT_TOKEN"]

[scopes.opentofu]
secrets = [
  "AWS_ACCESS_KEY_ID",
  "AWS_SECRET_ACCESS_KEY",
  "CLOUDFLARE_API_TOKEN",
  "HCLOUD_TOKEN",
  "TF_VAR_hetzner_storage_box_password",
  "TF_VAR_incus_acme_token",
  "TF_VAR_opentofu_state_encryption_passphrase",
]
