[project]
name = "hx-lab"
revision = "1.0"

[providers]
production = "sops://secrets/production.sops.env?format=dotenv"

[profiles.production.defaults]
providers = ["production"]

[profiles.production]
ADGUARD_PASSWORD = { description = "AdGuard Home password" }
ADGUARD_USERNAME = { description = "AdGuard Home username" }

AUTHENTIK_SECRET_KEY = { description = "Authentik secret key", type = "base64", generate = { bytes = 60 } }
AUTHENTIK_SMTP_API_KEY = { description = "Authentik SMTP API key" }
AUTHENTIK_TOKEN = { description = "Authentik API token" }

AWS_ACCESS_KEY_ID = { description = "OpenTofu state backend access key" }
AWS_SECRET_ACCESS_KEY = { description = "OpenTofu state backend secret key" }

CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token" }
CLOUDFLARE_CLIENT_ID = { description = "Cloudflare OAuth client ID", type = "uuid", generate = true }
CLOUDFLARE_CLIENT_SECRET = { description = "Cloudflare OAuth client secret", type = "password", generate = { length = 64 } }
CLOUDFLARED_TUNNEL_TOKEN = { description = "Cloudflared tunnel token" }

GRAFANA_ADMIN_PASSWORD = { description = "Grafana admin password", type = "password", generate = { length = 32 } }
GRAFANA_CLIENT_ID = { description = "Grafana OAuth client ID", type = "uuid", generate = true }
GRAFANA_CLIENT_SECRET = { description = "Grafana OAuth client secret", type = "password", generate = { length = 64 } }
GRAFANA_SMTP_API_KEY = { description = "Grafana SMTP API key" }
GRAFANA_SERVICE_ACCOUNT_TOKEN = { description = "Grafana Service Account Token" }

HETZNER_API_TOKEN = { description = "Hetzner API token" }

IMMICH_CLIENT_ID = { description = "Immich OAuth client ID", type = "uuid", generate = true }
IMMICH_CLIENT_SECRET = { description = "Immich OAuth client secret", type = "password", generate = { length = 64 } }

OPENTOFU_STATE_ENCRYPTION_PASSPHRASE = { description = "OpenTofu state encryption passphrase", type = "base64", generate = { bytes = 48 } }

PAPERLESS_ADMIN_EMAIL = { description = "Paperless admin email" }
PAPERLESS_ADMIN_PASSWORD = { description = "Paperless admin password", type = "password", generate = { length = 32 } }
PAPERLESS_ADMIN_USER = { description = "Paperless admin username" }
PAPERLESS_CLIENT_ID = { description = "Paperless OAuth client ID", type = "uuid", generate = true }
PAPERLESS_CLIENT_SECRET = { description = "Paperless OAuth client secret", type = "password", generate = { length = 64 } }
PAPERLESS_SECRET_KEY = { description = "Paperless secret key", type = "password", generate = { length = 64 } }

POSTGRES_AUTHENTIK_PASSWORD = { description = "Authentik PostgreSQL password", type = "base64", generate = { bytes = 36 } }
POSTGRES_PAPERLESS_PASSWORD = { description = "Paperless PostgreSQL password", type = "base64", generate = { bytes = 36 } }
POSTGRES_SUPERUSER_PASSWORD = { description = "PostgreSQL superuser password", type = "base64", generate = { bytes = 36 } }

PROXMOX_ACME_TOKEN = { description = "Proxmox ACME token" }
PROXMOX_SMTP_API_KEY = { description = "Proxmox SMTP API key" }
PROXMOX_VE_API_TOKEN = { description = "Proxmox VE API token" }

TRAEFIK_CF_DNS_API_TOKEN = { description = "Traefik Cloudflare DNS API token" }

VAULTWARDEN_CLIENT_ID = { description = "Vaultwarden OAuth client ID", type = "uuid", generate = true }
VAULTWARDEN_CLIENT_SECRET = { description = "Vaultwarden OAuth client secret", type = "password", generate = { length = 64 } }

TF_VAR_opentofu_state_encryption_passphrase = { description = "OpenTofu state encryption variable", composed = "${OPENTOFU_STATE_ENCRYPTION_PASSPHRASE}" }
TF_VAR_grafana_client_id = { description = "Grafana OAuth client ID variable", composed = "${GRAFANA_CLIENT_ID}" }
TF_VAR_grafana_client_secret = { description = "Grafana OAuth client secret variable", composed = "${GRAFANA_CLIENT_SECRET}" }
TF_VAR_paperless_client_id = { description = "Paperless OAuth client ID variable", composed = "${PAPERLESS_CLIENT_ID}" }
TF_VAR_paperless_client_secret = { description = "Paperless OAuth client secret variable", composed = "${PAPERLESS_CLIENT_SECRET}" }
TF_VAR_vaultwarden_client_id = { description = "Vaultwarden OAuth client ID variable", composed = "${VAULTWARDEN_CLIENT_ID}" }
TF_VAR_vaultwarden_client_secret = { description = "Vaultwarden OAuth client secret variable", composed = "${VAULTWARDEN_CLIENT_SECRET}" }

[scopes.swarm]
secrets = [
  "AUTHENTIK_SECRET_KEY",
  "AUTHENTIK_SMTP_API_KEY",
  "CLOUDFLARE_CLIENT_ID",
  "CLOUDFLARE_CLIENT_SECRET",
  "CLOUDFLARED_TUNNEL_TOKEN",
  "GRAFANA_ADMIN_PASSWORD",
  "GRAFANA_CLIENT_ID",
  "GRAFANA_CLIENT_SECRET",
  "GRAFANA_SMTP_API_KEY",
  "IMMICH_CLIENT_ID",
  "IMMICH_CLIENT_SECRET",
  "PAPERLESS_ADMIN_EMAIL",
  "PAPERLESS_ADMIN_PASSWORD",
  "PAPERLESS_ADMIN_USER",
  "PAPERLESS_CLIENT_ID",
  "PAPERLESS_CLIENT_SECRET",
  "PAPERLESS_SECRET_KEY",
  "POSTGRES_AUTHENTIK_PASSWORD",
  "POSTGRES_PAPERLESS_PASSWORD",
  "POSTGRES_SUPERUSER_PASSWORD",
  "TRAEFIK_CF_DNS_API_TOKEN",
  "VAULTWARDEN_CLIENT_ID",
  "VAULTWARDEN_CLIENT_SECRET",
]

[scopes.opencode]
secrets = [
  "GRAFANA_SERVICE_ACCOUNT_TOKEN",
]

[scopes.opentofu]
secrets = [
  "ADGUARD_PASSWORD",
  "ADGUARD_USERNAME",
  "AUTHENTIK_TOKEN",
  "AWS_ACCESS_KEY_ID",
  "AWS_SECRET_ACCESS_KEY",
  "CLOUDFLARE_API_TOKEN",
  "PROXMOX_VE_API_TOKEN",
  "TF_VAR_grafana_client_id",
  "TF_VAR_grafana_client_secret",
  "TF_VAR_opentofu_state_encryption_passphrase",
  "TF_VAR_paperless_client_id",
  "TF_VAR_paperless_client_secret",
  "TF_VAR_vaultwarden_client_id",
  "TF_VAR_vaultwarden_client_secret",
]

[scopes.pve]
secrets = [
  "PROXMOX_ACME_TOKEN",
  "PROXMOX_SMTP_API_KEY",
]
