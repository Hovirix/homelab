- name: Deploy apps services
  hosts: apps
  become: true
  gather_facts: false

  pre_tasks:
    - name: Load postgres service secrets
      community.sops.load_vars:
        file: "{{ apps_secret_files.postgres }}"
        name: sops_postgres

    - name: Load valkey service secrets
      community.sops.load_vars:
        file: "{{ apps_secret_files.valkey }}"
        name: sops_valkey

    - name: Load paperless service secrets
      community.sops.load_vars:
        file: "{{ apps_secret_files.paperless }}"
        name: sops_paperless

    - name: Load vaultwarden service secrets
      community.sops.load_vars:
        file: "{{ apps_secret_files.vaultwarden }}"
        name: sops_vaultwarden

  roles:
    - role: srv_data_disk
      vars:
        srv_layout: "{{ apps_srv_layout }}"

    - role: podman_secrets
      vars:
        podman_secrets_items: "{{ apps_podman_secrets }}"

    - role: quadlet
      vars:
        quadlet_dir: "{{ apps_quadlet_dir }}"
        quadlet_services: "{{ apps_quadlet }}"
