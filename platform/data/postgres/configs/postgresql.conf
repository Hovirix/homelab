# Connections are restricted by the Git-controlled HBA policy below.
listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
max_connections = 100
password_encryption = 'scram-sha-256'

# PostgreSQL shares this 8 GiB, two-vCPU node with other Swarm workloads.
shared_buffers = '1GB'
effective_cache_size = '3GB'
work_mem = '8MB'
maintenance_work_mem = '256MB'
autovacuum_work_mem = '128MB'
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1
autovacuum_max_workers = 2

# Keep committed data durable and make the WAL level explicit for future recovery work.
fsync = on
full_page_writes = on
synchronous_commit = on
wal_level = replica

# Spread checkpoint I/O over a longer interval on the VirtioFS-backed dataset.
wal_compression = lz4
min_wal_size = '512MB'
max_wal_size = '2GB'
checkpoint_timeout = '15min'

# WAL archiving remains disabled until a tested repository and archive_command exist.
archive_mode = off

# Emit diagnostics through the container log pipeline.
log_autovacuum_min_duration = '1s'
log_min_duration_statement = '1s'
log_checkpoints = on
log_lock_waits = on
deadlock_timeout = '1s'
log_temp_files = '10MB'
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# Bound abandoned application work without imposing a global query timeout.
idle_in_transaction_session_timeout = '5min'
track_io_timing = on
