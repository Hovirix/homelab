# Require passwords for local connections as well as overlay clients.
local   all         all                             scram-sha-256

# Cluster dumps need the superuser to connect to every database.
host    all         postgres    samenet             scram-sha-256
# Application roles may reach only their matching databases.
host    authentik   authentik   samenet             scram-sha-256
host    grafana     grafana     samenet             scram-sha-256
host    paperless   paperless   samenet             scram-sha-256
host    vaultwarden vaultwarden samenet             scram-sha-256
