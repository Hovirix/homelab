services:
  server:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280

    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      PGDATA: /var/lib/postgresql/data/pgdata

    secrets:
      - postgres_superuser_password

    networks:
      data:
        aliases:
          - postgres

    volumes:
      - type: bind
        source: /var/mnt/swarm/postgres
        target: /var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=postgres --dbname=postgres
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1

      update_config:
        order: stop-first
        failure_action: rollback

      rollback_config:
        order: stop-first

      restart_policy:
        condition: on-failure

  reconcile:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280

    command:
      - bash
      - /usr/local/bin/postgres-reconcile.sh

    configs:
      - source: postgres_reconcile
        target: /usr/local/bin/postgres-reconcile.sh
        mode: 0555

    secrets:
      - postgres_superuser_password
      - postgres_authentik_password
      - postgres_paperless_password

    networks:
      - data

    deploy:
      mode: replicated-job
      replicas: 1

      restart_policy:
        condition: on-failure

networks:
  data:
    name: data_data
    driver: overlay
    attachable: true

configs:
  postgres_reconcile:
    name: data_postgres_reconcile_20260812
    file: ./configs/postgres-reconcile.sh

secrets:
  postgres_superuser_password:
    external: true

  postgres_authentik_password:
    external: true

  postgres_paperless_password:
    external: true
