services:
  server:
    image: ghcr.io/hovirix/postgres:18.6@sha256:17c9f49fa51c21234a8c7d594f23f47ebe2b8510be0e16daaa1ba008e090fa18

    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      PGDATA: /var/lib/postgresql/data/pgdata

    secrets:
      - postgres_superuser_password

    configs:
      - source: postgres_config
        target: /etc/postgresql/postgresql.conf

      - source: postgres_hba
        target: /etc/postgresql/pg_hba.conf

    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf

    networks:
      postgres:
        aliases:
          - postgres

    volumes:
      - type: bind
        source: /var/mnt/swarm/postgres
        target: /var/lib/postgresql/data

    # PostgreSQL needs time to checkpoint and stop cleanly during Swarm updates.
    stop_grace_period: 2m

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=postgres --dbname=postgres
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1

      update_config:
        failure_action: rollback
        monitor: 2m

      restart_policy:
        condition: on-failure

  reconcile:
    image: ghcr.io/hovirix/postgres:18.6@sha256:17c9f49fa51c21234a8c7d594f23f47ebe2b8510be0e16daaa1ba008e090fa18

    command:
      - bash
      - /usr/local/bin/postgres-reconcile.sh

    configs:
      - source: postgres_reconcile
        target: /usr/local/bin/postgres-reconcile.sh
        mode: 0555

    secrets:
      - postgres_superuser_password
      - postgres_authentik_password
      - postgres_grafana_password
      - postgres_paperless_password
      - postgres_vaultwarden_password

    networks:
      - postgres

    deploy:
      mode: replicated-job
      replicas: 1

      restart_policy:
        condition: on-failure

networks:
  postgres:
    name: postgres
    attachable: true

configs:
  postgres_config:
    name: data_postgres_config
    file: ./configs/postgresql.conf

  postgres_hba:
    name: data_postgres_hba_v4
    file: ./configs/pg_hba.conf

  postgres_reconcile:
    name: data_postgres_reconcile_v4
    file: ./configs/postgres-reconcile.sh

secrets:
  postgres_superuser_password:
    external: true
    name: "postgres_superuser_password_3efce0f89928"

  postgres_authentik_password:
    external: true
    name: "postgres_authentik_password_7b6c7b2d278e"

  postgres_paperless_password:
    external: true
    name: "postgres_paperless_password_cdd4621df825"

  postgres_grafana_password:
    external: true
    name: "postgres_grafana_password_2201e1894f9b"

  postgres_vaultwarden_password:
    external: true
    name: "postgres_vaultwarden_password_9e5d202044cd"
