services:
  server:
    image: ghcr.io/hovirix/postgres:18.6@sha256:180d7699376473b7279121d99c726046b1948cd8baa3f3cc6d75a156f51428dd

    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      PGDATA: /var/lib/postgresql/data/pgdata

    secrets:
      - postgres_superuser_password

    configs:
      - source: postgres_config
        target: /etc/postgresql/postgresql.conf
        mode: 0444

      - source: postgres_hba
        target: /etc/postgresql/pg_hba.conf
        mode: 0444

    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf

    networks:
      postgres:
        aliases:
          - postgres

    volumes:
      - type: bind
        source: /var/mnt/swarm/postgres
        target: /var/lib/postgresql/data

    # PostgreSQL needs time to checkpoint and stop cleanly during Swarm updates.
    stop_grace_period: 2m

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=postgres --dbname=postgres
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1

      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 2m

      rollback_config:
        order: stop-first

      restart_policy:
        condition: on-failure

  reconcile:
    image: ghcr.io/hovirix/postgres:18.6@sha256:180d7699376473b7279121d99c726046b1948cd8baa3f3cc6d75a156f51428dd

    command:
      - bash
      - /usr/local/bin/postgres-reconcile.sh

    configs:
      - source: postgres_reconcile
        target: /usr/local/bin/postgres-reconcile.sh
        mode: 0555

    secrets:
      - postgres_superuser_password
      - postgres_authentik_password
      - postgres_paperless_password

    networks:
      - postgres

    deploy:
      mode: replicated-job
      replicas: 1

      restart_policy:
        condition: on-failure

networks:
  postgres:
    name: postgres
    driver: overlay
    attachable: true

configs:
  postgres_config:
    name: data_postgres_config_20260925
    file: ./configs/postgresql.conf

  postgres_hba:
    name: data_postgres_hba_20260925
    file: ./configs/pg_hba.conf

  postgres_reconcile:
    name: data_postgres_reconcile_20260925
    file: ./configs/postgres-reconcile.sh

secrets:
  postgres_superuser_password:
    external: true

  postgres_authentik_password:
    external: true

  postgres_paperless_password:
    external: true
