services:
  server:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11

    entrypoint:
      - valkey-server

    command:
      - --appendonly
      - "yes"

    networks:
      valkey:
        aliases:
          - valkey

    volumes:
      - type: bind
        source: /var/mnt/swarm/valkey
        target: /data

    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1

      update_config:
        failure_action: rollback

      restart_policy:
        condition: on-failure

networks:
  valkey:
    name: valkey
    attachable: true
