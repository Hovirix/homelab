services:
  server:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b

    entrypoint:
      - valkey-server

    command:
      - --appendonly
      - "yes"

    networks:
      valkey:
        aliases:
          - valkey

    volumes:
      - type: bind
        source: /var/mnt/swarm/valkey
        target: /data

    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1

      update_config:
        failure_action: rollback

      restart_policy:
        condition: any

networks:
  valkey:
    name: valkey
    attachable: true
