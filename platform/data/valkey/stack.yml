services:
  server:
    image: valkey/valkey:9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882

    entrypoint:
      - valkey-server

    command:
      - --appendonly
      - "yes"

    networks:
      valkey:
        aliases:
          - valkey

    volumes:
      - type: bind
        source: /var/mnt/swarm/valkey
        target: /data

    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1

      update_config:
        failure_action: rollback

      restart_policy:
        condition: any

networks:
  valkey:
    name: valkey
    attachable: true
