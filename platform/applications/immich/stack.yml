services:
  server:
    image: ghcr.io/immich-app/immich-server:v3.3.6@sha256:e1981983b1c13f6024b57d72e7ecae3342eed1581201ab09fb248932d86c593a

    environment:
      DB_HOSTNAME: postgres
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      DB_PASSWORD_FILE: /run/secrets/postgres_immich_password
      DB_VECTOR_EXTENSION: vectorchord
      REDIS_HOSTNAME: valkey
      REDIS_DBINDEX: "1"
      IMMICH_CONFIG_FILE: /run/secrets/immich_config
      IMMICH_ALLOW_SETUP: "false"

    secrets:
      - postgres_immich_password
      - immich_config

    networks:
      - immich
      - postgres
      - valkey
      - traefik

    volumes:
      - type: bind
        source: /var/mnt/swarm/immich
        target: /data

    healthcheck:
      test: [CMD, immich-healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    deploy:
      replicas: 1

      labels:
        - traefik.enable=true
        - traefik.http.routers.immich.rule=Host(`immich.hovirix.dev`)
        - traefik.http.routers.immich.entrypoints=websecure
        - traefik.http.services.immich.loadbalancer.server.port=2283

      update_config:
        failure_action: rollback

      restart_policy:
        condition: any

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.6@sha256:14367bfb374b8576ddf49abd67c5ca0190a4c7fcf6303cdad65d7f7bf1a50bc2

    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2

    networks:
      - immich

    volumes:
      - model-cache:/cache

    healthcheck:
      test: [CMD, python3, healthcheck.py]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    deploy:
      replicas: 1

      update_config:
        failure_action: rollback

      restart_policy:
        condition: any

networks:
  immich:
    driver: overlay

  postgres:
    external: true

  valkey:
    external: true

  traefik:
    external: true

volumes:
  model-cache:

secrets:
  postgres_immich_password:
    external: true
    name: "postgres_immich_password_b93fe97af2b2"

  immich_config:
    external: true
    name: "immich_config_d1ed75fd486f"
