services:
  server:
    image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd

    environment:
      DB_HOSTNAME: postgres
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      DB_PASSWORD_FILE: /run/secrets/postgres_immich_password
      DB_VECTOR_EXTENSION: vectorchord
      REDIS_HOSTNAME: valkey
      REDIS_DBINDEX: "1"
      IMMICH_CONFIG_FILE: /run/secrets/immich_config
      IMMICH_ALLOW_SETUP: "false"
      IMMICH_TELEMETRY_INCLUDE: all

    secrets:
      - postgres_immich_password
      - immich_config

    networks:
      - immich
      - postgres
      - valkey

    volumes:
      - type: bind
        source: /var/mnt/swarm/immich
        target: /data

    healthcheck:
      test: [CMD, immich-healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    deploy:
      replicas: 1

      labels:
        - traefik.enable=true
        - traefik.swarm.network=immich
        - traefik.http.routers.immich.rule=Host(`immich.hovirix.dev`)
        - traefik.http.routers.immich.entrypoints=websecure
        - traefik.http.services.immich.loadbalancer.server.port=2283

      update_config:
        failure_action: rollback

      restart_policy:
        condition: any

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91

    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2

    networks:
      - immich

    volumes:
      - model-cache:/cache

    healthcheck:
      test: [CMD, python3, healthcheck.py]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    deploy:
      replicas: 1

      update_config:
        failure_action: rollback

      restart_policy:
        condition: any

networks:
  immich:
    name: immich
    driver: overlay

  postgres:
    external: true

  valkey:
    external: true

volumes:
  model-cache:

secrets:
  postgres_immich_password:
    external: true
    name: "postgres_immich_password_b93fe97af2b2"

  immich_config:
    external: true
    name: "immich_config_d1ed75fd486f"
