services:
  gateway:
    image: ghcr.io/openclaw/openclaw:2026.10.9-browser@sha256:dceb7a2abe931f1cbe0e7f9babc48d93e763ff9efe07cd7310f98f25777ca62e

    command:
      - sh
      - -ec
      - |
        umask 077
        mkdir -p /home/node/.openclaw
        if [ ! -e /home/node/.openclaw/openclaw.json ]; then
          cp /etc/openclaw/openclaw.json /home/node/.openclaw/openclaw.json.tmp
          mv /home/node/.openclaw/openclaw.json.tmp /home/node/.openclaw/openclaw.json
        fi
        exec node /app/docker-entrypoint.mjs node openclaw.mjs gateway

    environment:
      OPENCLAW_INCLUDE_ROOTS: /etc/openclaw

    configs:
      - source: openclaw_config
        target: /etc/openclaw/openclaw.json
      - source: openclaw_gateway
        target: /etc/openclaw/gateway.json

    networks:
      - openclaw

    volumes:
      - type: bind
        source: /var/mnt/swarm/openclaw
        target: /home/node/.openclaw

    cap_drop:
      - ALL

    deploy:
      replicas: 1

      labels:
        - traefik.enable=true
        - traefik.swarm.network=openclaw
        - traefik.http.routers.openclaw.rule=Host(`openclaw.hovirix.dev`)
        - traefik.http.routers.openclaw.entrypoints=websecure
        - traefik.http.routers.openclaw.middlewares=openclaw-headers,openclaw-auth
        - traefik.http.services.openclaw.loadbalancer.server.port=18789
        - traefik.http.middlewares.openclaw-headers.headers.customrequestheaders.X-authentik-username=
        - traefik.http.middlewares.openclaw-headers.headers.customrequestheaders.X-OpenClaw-Scopes=
        - traefik.http.middlewares.openclaw-headers.headers.stsseconds=31536000
        - traefik.http.middlewares.openclaw-auth.forwardauth.address=http://authentik_server:9000/outpost.goauthentik.io/auth/traefik
        - traefik.http.middlewares.openclaw-auth.forwardauth.trustforwardheader=true
        - traefik.http.middlewares.openclaw-auth.forwardauth.authresponseheaders=X-authentik-username,X-OpenClaw-Scopes

      update_config:
        order: stop-first
        # An image rollback cannot undo SQLite migrations.
        failure_action: pause

      rollback_config:
        order: stop-first

networks:
  openclaw:
    external: true

configs:
  openclaw_config:
    name: openclaw_config_20261031
    file: ./configs/openclaw.json

  openclaw_gateway:
    name: openclaw_gateway_20261031_5
    file: ./configs/gateway.json
