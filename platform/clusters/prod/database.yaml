apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/database
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: observability
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
