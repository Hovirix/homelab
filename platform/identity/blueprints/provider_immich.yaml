# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json

version: 1

metadata:
  name: Immich

entries:
  - model: authentik_providers_oauth2.scopemapping
    id: immich-role
    identifiers:
      name: Immich role
    attrs:
      scope_name: immich
      expression: |
        return {"immich_role": "admin" if request.user.all_groups().filter(name="immich-admins").exists() else "user"}

  - model: authentik_providers_oauth2.oauth2provider
    id: immich-provider
    identifiers:
      name: Immich
    attrs:
      client_id: !File /run/secrets/immich_client_id
      client_secret: !File /run/secrets/immich_client_secret
      client_type: confidential
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://immich.hovirix.dev/auth/login
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://immich.hovirix.dev/user-settings
        - matching_mode: strict
          redirect_uri_type: authorization
          url: app.immich:///oauth-callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf immich-role

  - model: authentik_core.application
    id: immich-application
    identifiers:
      slug: immich
    attrs:
      name: Immich
      provider: !KeyOf immich-provider
      policy_engine_mode: any

  - model: authentik_core.group
    id: immich-admins
    identifiers:
      name: immich-admins

  - model: authentik_core.group
    id: immich-users
    identifiers:
      name: immich-users

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf immich-application
      order: 0
    attrs:
      group: !KeyOf immich-admins

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf immich-application
      order: 1
    attrs:
      group: !KeyOf immich-users
