services:
  server:
    image: ghcr.io/goauthentik/server:2026.8.0@sha256:7421753cfea67e89a6d295a1f0173ccea3866b33768c88dad90453b151cdcfd5

    command:
      - server

    environment:
      AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik_secret_key
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/postgres_authentik_password
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_EMAIL__HOST: smtp.resend.com
      AUTHENTIK_EMAIL__PORT: "587"
      AUTHENTIK_EMAIL__USERNAME: resend
      AUTHENTIK_EMAIL__PASSWORD: file:///run/secrets/authentik_smtp_api_key
      AUTHENTIK_EMAIL__FROM: authentik@hovirix.dev
      AUTHENTIK_EMAIL__USE_TLS: "true"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"

    secrets:
      - authentik_secret_key
      - postgres_authentik_password
      - authentik_smtp_api_key

    networks:
      - authentik
      - postgres
      - traefik

    healthcheck:
      test:
        - CMD
        - ak
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    deploy:
      replicas: 1

      labels:
        - traefik.enable=true
        - traefik.http.routers.authentik.rule=Host(`authentik.hovirix.dev`)
        - traefik.http.routers.authentik.entrypoints=websecure
        - traefik.http.routers.authentik.tls=true
        - traefik.http.routers.authentik.tls.certresolver=cloudflare
        - traefik.http.services.authentik.loadbalancer.server.port=9000

      update_config:
        order: stop-first
        failure_action: rollback

      rollback_config:
        order: stop-first

      restart_policy:
        condition: on-failure

  worker:
    image: ghcr.io/goauthentik/server:2026.8.0@sha256:7421753cfea67e89a6d295a1f0173ccea3866b33768c88dad90453b151cdcfd5

    command:
      - worker

    environment:
      AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik_secret_key
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/postgres_authentik_password
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_EMAIL__HOST: smtp.resend.com
      AUTHENTIK_EMAIL__PORT: "587"
      AUTHENTIK_EMAIL__USERNAME: resend
      AUTHENTIK_EMAIL__PASSWORD: file:///run/secrets/authentik_smtp_api_key
      AUTHENTIK_EMAIL__FROM: authentik@hovirix.dev
      AUTHENTIK_EMAIL__USE_TLS: "true"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_OUTPOSTS__DISCOVER: "false"

    configs:
      - source: authentik_stages
        target: /blueprints/stages.yaml
        mode: 0444
      - source: authentik_provider_grafana
        target: /blueprints/provider_grafana.yaml
        mode: 0444
      - source: authentik_provider_paperless
        target: /blueprints/provider_paperless.yaml
        mode: 0444
      - source: authentik_provider_vaultwarden
        target: /blueprints/provider_vaultwarden.yaml
        mode: 0444

    secrets:
      - authentik_secret_key
      - postgres_authentik_password
      - authentik_smtp_api_key
      - grafana_client_id
      - grafana_client_secret
      - paperless_client_id
      - paperless_client_secret
      - vaultwarden_client_id
      - vaultwarden_client_secret

    networks:
      - authentik
      - postgres

    healthcheck:
      test:
        - CMD
        - ak
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    deploy:
      replicas: 1

      update_config:
        order: stop-first
        failure_action: rollback

      rollback_config:
        order: stop-first

      restart_policy:
        condition: on-failure

networks:
  authentik:
    name: authentik
    driver: overlay
    attachable: true

  postgres:
    name: postgres
    external: true

  traefik:
    name: traefik
    external: true

configs:
  authentik_stages:
    name: identity_authentik_stages_20261005
    file: ./blueprints/stages.yaml

  authentik_provider_grafana:
    name: identity_authentik_provider_grafana_20261005
    file: ./blueprints/provider_grafana.yaml

  authentik_provider_paperless:
    name: identity_authentik_provider_paperless_20261005
    file: ./blueprints/provider_paperless.yaml

  authentik_provider_vaultwarden:
    name: identity_authentik_provider_vaultwarden_20261005
    file: ./blueprints/provider_vaultwarden.yaml

secrets:
  authentik_secret_key:
    external: true

  postgres_authentik_password:
    external: true

  authentik_smtp_api_key:
    external: true

  grafana_client_id:
    external: true

  grafana_client_secret:
    external: true

  paperless_client_id:
    external: true

  paperless_client_secret:
    external: true

  vaultwarden_client_id:
    external: true

  vaultwarden_client_secret:
    external: true
