services:
  server:
    image: ghcr.io/goauthentik/server:2026.8.7@sha256:1675a017c46ba7f4f15333aeafeeb64538c581673bcbcd36af872cdf7de4e7f7

    command:
      - server

    environment:
      AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik_secret_key
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/postgres_authentik_password
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"

    secrets:
      - authentik_secret_key
      - postgres_authentik_password

    networks:
      - authentik
      - postgres

    healthcheck:
      test:
        - CMD
        - ak
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    deploy:
      replicas: 1

      labels:
        - traefik.enable=true
        - traefik.swarm.network=authentik
        - traefik.http.routers.authentik.rule=Host(`authentik.hovirix.dev`)
        - traefik.http.routers.authentik.entrypoints=websecure
        - traefik.http.services.authentik.loadbalancer.server.port=9000
        - traefik.http.routers.openclaw-outpost.rule=Host(`openclaw.hovirix.dev`) && PathPrefix(`/outpost.goauthentik.io/`)
        - traefik.http.routers.openclaw-outpost.entrypoints=websecure
        - traefik.http.routers.openclaw-outpost.service=authentik
        - traefik.http.routers.openclaw-outpost.priority=100

      update_config:
        failure_action: rollback

      restart_policy:
        condition: any

  worker:
    image: ghcr.io/goauthentik/server:2026.8.7@sha256:1675a017c46ba7f4f15333aeafeeb64538c581673bcbcd36af872cdf7de4e7f7

    command:
      - worker

    environment:
      AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik_secret_key
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/postgres_authentik_password
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_OUTPOSTS__DISCOVER: "false"

    configs:
      - source: authentik_notifications
        target: /blueprints/notifications.yaml
      - source: authentik_stages
        target: /blueprints/stages.yaml
      - source: authentik_provider_grafana
        target: /blueprints/provider_grafana.yaml
      - source: authentik_provider_miniflux
        target: /blueprints/provider_miniflux.yaml
      - source: authentik_provider_mail_archiver
        target: /blueprints/provider_mail_archiver.yaml
      - source: authentik_provider_immich
        target: /blueprints/provider_immich.yaml
      - source: authentik_provider_paperless
        target: /blueprints/provider_paperless.yaml
      - source: authentik_provider_vaultwarden
        target: /blueprints/provider_vaultwarden.yaml
      - source: authentik_memberships
        target: /blueprints/memberships.yaml

    secrets:
      - authentik_secret_key
      - postgres_authentik_password
      - ntfy_authentik_token
      - grafana_client_id
      - grafana_client_secret
      - miniflux_client_id
      - miniflux_client_secret
      - mail_archiver_client_id
      - mail_archiver_client_secret
      - immich_client_id
      - immich_client_secret
      - paperless_client_id
      - paperless_client_secret
      - vaultwarden_client_id
      - vaultwarden_client_secret

    networks:
      - authentik
      - postgres

    healthcheck:
      test:
        - CMD
        - ak
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    deploy:
      replicas: 1

      update_config:
        failure_action: rollback

      restart_policy:
        condition: any

