services:
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.6

    command:
      - server

    environment:
      AUTHENTIK_SECRET_KEY: file:///run/secrets/identity_authentik_secret_key
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/data_postgres_authentik_password
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_EMAIL__HOST: file:///run/secrets/smtp_host
      AUTHENTIK_EMAIL__PORT: file:///run/secrets/smtp_port
      AUTHENTIK_EMAIL__USERNAME: file:///run/secrets/smtp_user
      AUTHENTIK_EMAIL__PASSWORD: file:///run/secrets/smtp_password
      AUTHENTIK_EMAIL__FROM: file:///run/secrets/smtp_from
      AUTHENTIK_EMAIL__USE_TLS: "true"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"

    secrets:
      - identity_authentik_secret_key
      - data_postgres_authentik_password
      - smtp_host
      - smtp_port
      - smtp_user
      - smtp_password
      - smtp_from

    networks:
      - data
      - traefik-public

    deploy:
      replicas: 1

      labels:
        - traefik.enable=true
        - traefik.http.routers.authentik.rule=Host(`authentik.home.hovirix.dev`)
        - traefik.http.routers.authentik.entrypoints=websecure
        - traefik.http.routers.authentik.tls=true
        - traefik.http.routers.authentik.tls.certresolver=cloudflare
        - traefik.http.services.authentik.loadbalancer.server.port=9000

      update_config:
        order: stop-first
        failure_action: rollback

      rollback_config:
        order: stop-first

      restart_policy:
        condition: on-failure

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.6

    command:
      - worker

    environment:
      AUTHENTIK_SECRET_KEY: file:///run/secrets/identity_authentik_secret_key
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/data_postgres_authentik_password
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_EMAIL__HOST: file:///run/secrets/smtp_host
      AUTHENTIK_EMAIL__PORT: file:///run/secrets/smtp_port
      AUTHENTIK_EMAIL__USERNAME: file:///run/secrets/smtp_user
      AUTHENTIK_EMAIL__PASSWORD: file:///run/secrets/smtp_password
      AUTHENTIK_EMAIL__FROM: file:///run/secrets/smtp_from
      AUTHENTIK_EMAIL__USE_TLS: "true"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_OUTPOSTS__DISCOVER: "false"

    secrets:
      - identity_authentik_secret_key
      - data_postgres_authentik_password
      - smtp_host
      - smtp_port
      - smtp_user
      - smtp_password
      - smtp_from

    networks:
      - data

    deploy:
      replicas: 1

      update_config:
        order: stop-first
        failure_action: rollback

      rollback_config:
        order: stop-first

      restart_policy:
        condition: on-failure

networks:
  data:
    name: data_data
    external: true

  traefik-public:
    name: ingress_traefik-public
    external: true

secrets:
  identity_authentik_secret_key:
    external: true

  data_postgres_authentik_password:
    external: true

  smtp_host:
    external: true

  smtp_port:
    external: true

  smtp_user:
    external: true

  smtp_password:
    external: true

  smtp_from:
    external: true
