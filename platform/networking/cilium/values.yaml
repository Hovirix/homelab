ipam:
  mode: kubernetes

kubeProxyReplacement: true

l2announcements:
  enabled: true

operator:
  replicas: 1

k8sServiceHost: localhost
k8sServicePort: 7445

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

gatewayAPI:
  enabled: false

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
