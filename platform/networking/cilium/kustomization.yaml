apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - repository.yaml
  - release.yaml
  - l2-announcement-policy.yaml
  - load-balancer-pool.yaml

configMapGenerator:
  - name: cilium-values
    namespace: flux-system
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true
