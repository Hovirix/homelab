services:
  traefik:
    image: traefik:v3.7

    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false

      - --log.level=INFO
      - --accesslog=true

      - --api.dashboard=true
      - --ping=true

      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=home.hovirix.dev
      - --entrypoints.websecure.http.tls.domains[0].sans=*.home.hovirix.dev

      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=ingress_traefik-public

      - --certificatesresolvers.cloudflare.acme.email=hostmaster@hovirix.dev
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53

    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/ingress_traefik_cf_dns_api_token

    user: "0:984"

    secrets:
      - ingress_traefik_cf_dns_api_token

    networks:
      - traefik-public

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress

      - target: 443
        published: 443
        protocol: tcp
        mode: ingress

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik-letsencrypt:/letsencrypt

    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1

      placement:
        constraints:
          - node.role == manager

      labels:
        - traefik.enable=true
        - traefik.http.routers.traefik.rule=Host(`traefik.home.hovirix.dev`)
        - traefik.http.routers.traefik.entrypoints=websecure
        - traefik.http.routers.traefik.tls=true
        - traefik.http.routers.traefik.tls.certresolver=cloudflare
        - traefik.http.routers.traefik.service=api@internal
        - traefik.http.services.traefik.loadbalancer.server.port=8080

      update_config:
        order: start-first
        failure_action: rollback

      rollback_config:
        order: stop-first

      restart_policy:
        condition: on-failure

networks:
  traefik-public:
    driver: overlay
    attachable: true

secrets:
  ingress_traefik_cf_dns_api_token:
    external: true

volumes:
  traefik-letsencrypt:
