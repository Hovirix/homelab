services:
  proxy:
    image: traefik:v3.8@sha256:00c9734983e74ae35a1fc18eaee9e9da13f3dde95c4e45b3b8c3b60e0dbd2d17

    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false

      - --accesslog=true

      - --ping=true
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics

      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.forwardedheaders.trustedips=10.254.0.0/24
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=hovirix.dev
      - --entrypoints.websecure.http.tls.domains[0].sans=*.hovirix.dev
      - --entrypoints.metrics.address=:8082

      - --providers.swarm=true
      - --providers.swarm.endpoint=tcp://socket-proxy:2375
      - --providers.swarm.exposedbydefault=false

      - --certificatesresolvers.cloudflare.acme.email=homelab@hovirix.dev
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53

    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/traefik_cf_dns_api_token

    user: "0:984"

    secrets:
      - traefik_cf_dns_api_token

    networks:
      - traefik
      - cloudflared
      - socket-proxy
      - authentik
      - observability
      - vaultwarden
      - paperless
      - miniflux
      - ntfy
      - mail-archiver
      - immich
      - openclaw

    # Accept ingress routing-mesh SNAT: direct LAN client IPs are not preserved.
    # Do not rely on the observed source IP for per-client LAN access controls.
    ports:
      - target: 80
        published: 80

      - target: 443
        published: 443

    volumes:
      - type: bind
        source: /var/mnt/swarm/traefik
        target: /letsencrypt

    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1

      update_config:
        order: start-first
        failure_action: rollback

      restart_policy:
        condition: any

networks:
  ntfy:
    external: true

  mail-archiver:
    external: true

  openclaw:
    external: true

  traefik:
    name: traefik
    attachable: true

  cloudflared:
    external: true

  socket-proxy:
    external: true

  authentik:
    external: true

  observability:
    external: true

  vaultwarden:
    external: true

  paperless:
    external: true

  miniflux:
    external: true

  immich:
    external: true

secrets:
  traefik_cf_dns_api_token:
    external: true
    name: "traefik_cf_dns_api_token_f97cf50f949d"
