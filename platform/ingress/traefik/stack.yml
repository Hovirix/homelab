services:
  proxy:
    image: traefik:v3.7

    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false

      - --log.level=INFO
      - --accesslog=true

      - --api.dashboard=false
      - --api.insecure=false
      - --ping=true
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics

      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=hovirix.dev
      - --entrypoints.websecure.http.tls.domains[0].sans=*.hovirix.dev
      - --entrypoints.metrics.address=:8082

      - --providers.swarm=true
      - --providers.swarm.endpoint=tcp://socket-proxy:2375
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=ingress_traefik-public

      - --certificatesresolvers.cloudflare.acme.email=hostmaster@hovirix.dev
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53

    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/traefik_cf_dns_api_token

    user: "0:984"

    secrets:
      - traefik_cf_dns_api_token

    networks:
      - traefik-public
      - socket-proxy

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress

      - target: 443
        published: 443
        protocol: tcp
        mode: ingress

    volumes:
      - type: bind
        source: /var/mnt/swarm/traefik
        target: /letsencrypt

    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1

      update_config:
        order: start-first
        failure_action: rollback

      rollback_config:
        order: stop-first

      restart_policy:
        condition: on-failure

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2

    environment:
      EVENTS: "1"
      INFO: "1"
      NETWORKS: "1"
      NODES: "1"
      SERVICES: "1"
      SWARM: "1"
      TASKS: "1"

    networks:
      - socket-proxy

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    deploy:
      replicas: 1

      restart_policy:
        condition: on-failure

networks:
  traefik-public:
    name: ingress_traefik-public
    driver: overlay
    attachable: true

  socket-proxy:
    driver: overlay
    internal: true

secrets:
  traefik_cf_dns_api_token:
    external: true
