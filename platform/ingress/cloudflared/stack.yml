services:
  tunnel:
    image: cloudflare/cloudflared:2026.10.4@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515

    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflared_tunnel_token

    secrets:
      - cloudflared_tunnel_token

    networks:
      - cloudflared

    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:2000
        - ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      mode: global

      restart_policy:
        condition: any

networks:
  cloudflared:
    external: true

secrets:
  cloudflared_tunnel_token:
    external: true
    name: "cloudflared_tunnel_token_eba19c7658d7"
