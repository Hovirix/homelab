services:
  tunnel:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07

    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflared_tunnel_token

    secrets:
      - cloudflared_tunnel_token

    networks:
      - traefik

    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:2000
        - ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      mode: global

      restart_policy:
        condition: on-failure

networks:
  traefik:
    name: traefik
    external: true

secrets:
  cloudflared_tunnel_token:
    external: true
