services:
  tunnel:
    image: cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6

    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflared_tunnel_token

    secrets:
      - cloudflared_tunnel_token

    networks:
      - cloudflared

    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:2000
        - ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      mode: global

      restart_policy:
        condition: any

networks:
  cloudflared:
    name: cloudflared
    ipam:
      config:
        - subnet: 10.254.0.0/24

secrets:
  cloudflared_tunnel_token:
    external: true
    name: "cloudflared_tunnel_token_50d43d9c292b"
