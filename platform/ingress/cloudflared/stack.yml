services:
  tunnel:
    image: cloudflare/cloudflared:2025.8.1

    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflared_tunnel_token

    secrets:
      - cloudflared_tunnel_token

    networks:
      - traefik-public

    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:2000
        - ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      mode: global

      restart_policy:
        condition: on-failure

networks:
  traefik-public:
    name: ingress_traefik-public
    external: true

secrets:
  cloudflared_tunnel_token:
    external: true
