apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  releaseName: loki
  interval: 1h
  targetNamespace: observability
  chart:
    spec:
      chart: loki
      version: 18.5.4
      sourceRef:
        kind: HelmRepository
        name: loki
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
      valuesKey: values.yaml
