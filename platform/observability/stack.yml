services:
  grafana:
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b

    environment:
      GF_SERVER_DOMAIN: grafana.hovirix.dev
      GF_SERVER_ROOT_URL: https://grafana.hovirix.dev
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: authentik
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID__FILE: /run/secrets/grafana_client_id
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana_client_secret
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://authentik.hovirix.dev/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://authentik.hovirix.dev/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: https://authentik.hovirix.dev/application/o/userinfo/
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email entitlements
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://authentik.hovirix.dev/application/o/grafana/end-session/
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'grafana-admins') && 'GrafanaAdmin' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.resend.com:587
      GF_SMTP_USER: resend
      GF_SMTP_PASSWORD__FILE: /run/secrets/grafana_smtp_api_key
      GF_SMTP_FROM_ADDRESS: grafana@hovirix.dev
      GF_SMTP_FROM_NAME: Grafana
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS

    secrets:
      - grafana_admin_password
      - grafana_client_id
      - grafana_client_secret
      - grafana_smtp_api_key

    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml

      - source: grafana_alerting
        target: /etc/grafana/provisioning/alerting/hx-lab.yml

    networks:
      - observability
      - traefik-public

    volumes:
      - type: bind
        source: /var/mnt/swarm/grafana
        target: /var/lib/grafana

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:3000/api/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    deploy:
      replicas: 1

      labels:
        - traefik.enable=true
        - traefik.http.routers.grafana.rule=Host(`grafana.hovirix.dev`)
        - traefik.http.routers.grafana.entrypoints=websecure
        - traefik.http.routers.grafana.tls=true
        - traefik.http.routers.grafana.tls.certresolver=cloudflare
        - traefik.http.services.grafana.loadbalancer.server.port=3000

      update_config:
        order: start-first
        failure_action: rollback

      rollback_config:
        order: stop-first

      restart_policy:
        condition: on-failure

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.150.0@sha256:54467c7764a3e6579199af1914bb779f01ce32265cd552eb5ae0d4f8a2b80a97

    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=90d

    networks:
      - observability

    volumes:
      - type: bind
        source: /var/mnt/swarm/victoriametrics
        target: /victoria-metrics-data

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8428/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1

      update_config:
        order: stop-first
        failure_action: rollback

      rollback_config:
        order: stop-first

      restart_policy:
        condition: on-failure

  loki:
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500

    command:
      - -config.file=/etc/loki/loki.yml

    configs:
      - source: loki_config
        target: /etc/loki/loki.yml

    networks:
      - observability

    volumes:
      - type: bind
        source: /var/mnt/swarm/loki
        target: /loki

    deploy:
      replicas: 1

      update_config:
        order: stop-first
        failure_action: rollback

      rollback_config:
        order: stop-first

      restart_policy:
        condition: on-failure

  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy

    user: "0:0"

    cap_add:
      - SYS_ADMIN

    environment:
      ALLOY_NODE: "{{.Node.Hostname}}"

    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy

    networks:
      - observability
      - traefik-public

    volumes:
      # Unix exporter
      - /:/host/root:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

      # cAdvisor
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

      # Journal
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro

    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/12345
          printf 'GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == "HTTP/"*" 200 "* ]]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      mode: global

      update_config:
        order: stop-first
        failure_action: rollback

      rollback_config:
        order: stop-first

      restart_policy:
        condition: on-failure

networks:
  observability:
    driver: overlay

  traefik-public:
    name: ingress_traefik-public
    external: true

configs:
  grafana_datasources:
    name: observability_grafana_datasources_v2
    file: ./configs/grafana/provisioning/datasources.yml

  grafana_alerting:
    name: observability_grafana_alerting_v1
    file: ./configs/grafana/provisioning/alerting/hx-lab.yml

  loki_config:
    name: observability_loki_config_v2
    file: ./configs/loki/config.yml

  alloy_config:
    name: observability_alloy_config_v9
    file: ./configs/alloy/config.alloy

secrets:
  grafana_admin_password:
    external: true

  grafana_client_id:
    external: true

  grafana_client_secret:
    external: true

  grafana_smtp_api_key:
    external: true
