services:
  grafana:
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101

    entrypoint: ["/bin/sh", "/etc/grafana/ntfy-start.sh"]

    environment:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD__FILE: /run/secrets/postgres_grafana_password
      GF_SERVER_ROOT_URL: https://grafana.hovirix.dev
      GF_DATE_FORMATS_FULL_DATE: "YYYY-MM-DD HH:mm:ss Z"
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource@4.1.6
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: authentik
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID__FILE: /run/secrets/grafana_client_id
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana_client_secret
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://authentik.hovirix.dev/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://authentik.hovirix.dev/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: https://authentik.hovirix.dev/application/o/userinfo/
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email entitlements
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://authentik.hovirix.dev/application/o/grafana/end-session/
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'grafana-admins') && 'GrafanaAdmin' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_SMTP_ENABLED: "false"

    secrets:
      - postgres_grafana_password
      - grafana_admin_password
      - grafana_client_id
      - grafana_client_secret
      - ntfy_grafana_token

    configs:
      - source: grafana_ntfy_start
        target: /etc/grafana/ntfy-start.sh
        mode: 0555

      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml

      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/dashboards.yml

      - source: grafana_dashboard_platform
        target: /etc/grafana/dashboards/platform.json

      - source: grafana_dashboard_networking
        target: /etc/grafana/dashboards/networking.json

      - source: grafana_dashboard_security
        target: /etc/grafana/dashboards/security.json

      - source: grafana_alerting_openwrt
        target: /etc/grafana/provisioning/alerting/openwrt.yml

      - source: grafana_alerting_notifications
        target: /etc/grafana/provisioning/alerting/notifications.yml

      - source: grafana_alerting_nodes
        target: /etc/grafana/provisioning/alerting/nodes.yml

      - source: grafana_alerting_storage
        target: /etc/grafana/provisioning/alerting/storage.yml

      - source: grafana_alerting_containers
        target: /etc/grafana/provisioning/alerting/containers.yml

      - source: grafana_alerting_postgres
        target: /etc/grafana/provisioning/alerting/postgres.yml

      - source: grafana_alerting_traefik
        target: /etc/grafana/provisioning/alerting/traefik.yml

      - source: grafana_alerting_authentik
        target: /etc/grafana/provisioning/alerting/authentik.yml

      - source: grafana_alerting_blackbox
        target: /etc/grafana/provisioning/alerting/blackbox.yml

      - source: grafana_alerting_backups
        target: /etc/grafana/provisioning/alerting/backups.yml

      - source: grafana_alerting_cloudflared
        target: /etc/grafana/provisioning/alerting/cloudflared.yml

      - source: grafana_alerting_metrics
        target: /etc/grafana/provisioning/alerting/metrics.yml

    networks:
      - postgres
      - observability

    volumes:
      - type: bind
        source: /var/mnt/swarm/grafana
        target: /var/lib/grafana

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:3000/api/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    deploy:
      replicas: 1

      labels:
        - traefik.enable=true
        - traefik.swarm.network=observability
        - traefik.http.routers.grafana.rule=Host(`grafana.hovirix.dev`) && !PathPrefix(`/metrics`)
        - traefik.http.routers.grafana.entrypoints=websecure
        - traefik.http.services.grafana.loadbalancer.server.port=3000

      update_config:
        order: start-first
        failure_action: rollback

      restart_policy:
        condition: any

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.156.0@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970

    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=90d

    networks:
      - observability

    volumes:
      - type: bind
        source: /var/mnt/swarm/victoriametrics
        target: /victoria-metrics-data

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8428/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1

      update_config:
        failure_action: rollback

      restart_policy:
        condition: any

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7

    command:
      - -config.file=/etc/loki/loki.yml

    configs:
      - source: loki_config
        target: /etc/loki/loki.yml

    networks:
      - observability

    volumes:
      - type: bind
        source: /var/mnt/swarm/loki
        target: /loki

    deploy:
      replicas: 1

      labels:
        - traefik.enable=true
        - traefik.swarm.network=observability
        - traefik.http.routers.loki-push.rule=Host(`loki.hovirix.dev`) && Path(`/loki/api/v1/push`) && Method(`POST`)
        - traefik.http.routers.loki-push.entrypoints=websecure
        - traefik.http.routers.loki-push.service=loki-ingest
        - traefik.http.services.loki-ingest.loadbalancer.server.port=3100

      update_config:
        failure_action: rollback

      restart_policy:
        condition: any

  swarm-exporter:
    image: ghcr.io/leinardi/swarm-scheduler-exporter:v3.1.0@sha256:9ef395c7a79edba0532323a55b2a653dc92a73f1e009321944800ec6e89b1163

    environment:
      DOCKER_HOST: tcp://socket-proxy:2375

    networks:
      - observability
      - socket-proxy

    read_only: true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - /usr/local/bin/swarm-scheduler-exporter
        - --healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

    deploy:
      replicas: 1

      update_config:
        failure_action: rollback

      restart_policy:
        condition: any

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.21.1@sha256:3b8e05a84282cd1199ad2fb6c66f362738bf4c68c1547d8f4226a34a7dd6d8d7

    command:
      - --collector.stat_statements
      - --collector.stat_checkpointer

    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_exporter_password

    secrets:
      - postgres_exporter_password

    networks:
      - postgres
      - observability

    read_only: true

    cap_drop:
      - ALL

    deploy:
      replicas: 1

      restart_policy:
        condition: any

  valkey-exporter:
    image: oliver006/redis_exporter:v1.97.0@sha256:f5f903fbe77571d455ede0453b084d6840bc62fc105efac001034421cab83b99

    command:
      - --redis.addr=redis://valkey:6379

    networks:
      - valkey
      - observability

    read_only: true

    cap_drop:
      - ALL

    deploy:
      replicas: 1

      restart_policy:
        condition: any

  alloy:
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.d

    user: "0:0"

    cap_add:
      - SYS_ADMIN

    environment:
      ALLOY_NODE: "{{.Node.Hostname}}"

    configs:
      - source: alloy_outputs
        target: /etc/alloy/config.d/outputs.alloy

      - source: alloy_docker
        target: /etc/alloy/config.d/docker.alloy

      - source: alloy_journal
        target: /etc/alloy/config.d/journal.alloy

      - source: alloy_host
        target: /etc/alloy/config.d/host.alloy

      - source: alloy_containers
        target: /etc/alloy/config.d/containers.alloy

      - source: alloy_traefik
        target: /etc/alloy/config.d/traefik.alloy

      - source: alloy_swarm
        target: /etc/alloy/config.d/swarm.alloy

      - source: alloy_services
        target: /etc/alloy/config.d/services.alloy

      - source: alloy_blackbox
        target: /etc/alloy/config.d/blackbox.alloy

      - source: alloy_blackbox_modules
        target: /etc/alloy/blackbox.yml

      - source: alloy_openwrt
        target: /etc/alloy/config.d/openwrt.alloy

    # Bypass the routing mesh so the syslog source-IP filter sees the router.
    ports:
      - target: 1514
        published: 1514
        protocol: tcp
        mode: host

    networks:
      - observability
      - authentik
      - cloudflared
      - immich
      - miniflux
      - paperless

    volumes:
      # Unix exporter
      - /:/host/root:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

      # cAdvisor
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

      # Journal
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro

    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/12345
          printf 'GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == "HTTP/"*" 200 "* ]]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      mode: global

      update_config:
        failure_action: rollback

      restart_policy:
        condition: any

networks:
  authentik:
    external: true

  cloudflared:
    external: true

  valkey:
    external: true

  postgres:
