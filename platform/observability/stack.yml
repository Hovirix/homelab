services:
  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572

    environment:
      GF_SERVER_ROOT_URL: https://grafana.hovirix.dev
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: authentik
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID__FILE: /run/secrets/grafana_client_id
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana_client_secret
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://authentik.hovirix.dev/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://authentik.hovirix.dev/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: https://authentik.hovirix.dev/application/o/userinfo/
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email entitlements
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://authentik.hovirix.dev/application/o/grafana/end-session/
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'grafana-admins') && 'GrafanaAdmin' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.resend.com:587
      GF_SMTP_USER: resend
      GF_SMTP_PASSWORD__FILE: /run/secrets/grafana_smtp_api_key
      GF_SMTP_FROM_ADDRESS: grafana@hovirix.dev
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS

    secrets:
      - grafana_admin_password
      - grafana_client_id
      - grafana_client_secret
      - grafana_smtp_api_key

    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml

      - source: grafana_alerting_notifications
        target: /etc/grafana/provisioning/alerting/notifications.yml

      - source: grafana_alerting_nodes
        target: /etc/grafana/provisioning/alerting/nodes.yml

      - source: grafana_alerting_storage
        target: /etc/grafana/provisioning/alerting/storage.yml

      - source: grafana_alerting_containers
        target: /etc/grafana/provisioning/alerting/containers.yml

      - source: grafana_alerting_postgres
        target: /etc/grafana/provisioning/alerting/postgres.yml

      - source: grafana_alerting_traefik
        target: /etc/grafana/provisioning/alerting/traefik.yml

      - source: grafana_alerting_authentik
        target: /etc/grafana/provisioning/alerting/authentik.yml

    networks:
      - observability
      - traefik

    volumes:
      - type: bind
        source: /var/mnt/swarm/grafana
        target: /var/lib/grafana

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:3000/api/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    deploy:
      replicas: 1

      labels:
        - traefik.enable=true
        - traefik.http.routers.grafana.rule=Host(`grafana.hovirix.dev`)
        - traefik.http.routers.grafana.entrypoints=websecure
        - traefik.http.services.grafana.loadbalancer.server.port=3000

      update_config:
        order: start-first
        failure_action: rollback

      restart_policy:
        condition: on-failure

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0@sha256:5eff7af5341e401471002f58d106d399e614a62f3d240f2dbc21901e49eed5dd

    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=90d

    networks:
      - observability

    volumes:
      - type: bind
        source: /var/mnt/swarm/victoriametrics
        target: /victoria-metrics-data

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8428/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1

      update_config:
        failure_action: rollback

      restart_policy:
        condition: on-failure

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193

    command:
      - -config.file=/etc/loki/loki.yml

    configs:
      - source: loki_config
        target: /etc/loki/loki.yml

    networks:
      - observability

    volumes:
      - type: bind
        source: /var/mnt/swarm/loki
        target: /loki

    deploy:
      replicas: 1

      update_config:
        failure_action: rollback

      restart_policy:
        condition: on-failure

  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.d

    user: "0:0"

    cap_add:
      - SYS_ADMIN

    environment:
      ALLOY_NODE: "{{.Node.Hostname}}"

    configs:
      - source: alloy_outputs
        target: /etc/alloy/config.d/outputs.alloy

      - source: alloy_docker
        target: /etc/alloy/config.d/docker.alloy

      - source: alloy_journal
        target: /etc/alloy/config.d/journal.alloy

      - source: alloy_host
        target: /etc/alloy/config.d/host.alloy

      - source: alloy_containers
        target: /etc/alloy/config.d/containers.alloy

      - source: alloy_traefik
        target: /etc/alloy/config.d/traefik.alloy

    networks:
      - observability
      - traefik

    volumes:
      # Unix exporter
      - /:/host/root:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

      # cAdvisor
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

      # Journal
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro

    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/12345
          printf 'GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == "HTTP/"*" 200 "* ]]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      mode: global

      update_config:
        failure_action: rollback

      restart_policy:
        condition: on-failure

networks:
  observability:
    name: observability
    attachable: true

  traefik:
    external: true

configs:
  grafana_datasources:
