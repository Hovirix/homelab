persistence:
  enabled: false

grafana.ini:
  auth.anonymous:
    enabled: false
  server:
    domain: grafana.home.hovirix.dev
    root_url: https://grafana.home.hovirix.dev/
  users:
    allow_sign_up: false

datasources:
  datasources.yaml:
    apiVersion: 1
    prune: true
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local
        isDefault: true
        editable: false
