[global]
hostname = parent

[db]
db = dbengine
dbengine tier backfill = new
storage tiers = 3
dbengine page cache size = 512MiB

# High-resolution data is short-lived; downsampled tiers preserve useful trends.
dbengine tier 0 retention size = 4GiB
dbengine tier 0 retention time = 7d
dbengine tier 1 update every iterations = 60
dbengine tier 1 retention size = 2GiB
dbengine tier 1 retention time = 30d
dbengine tier 2 update every iterations = 60
dbengine tier 2 retention size = 1GiB
dbengine tier 2 retention time = 180d

[ml]
enabled = yes

[health]
enabled = yes

[web]
bind to = *:19999=streaming *:19998=dashboard|registry|badges|management|netdata.conf
allow connections from = localhost 10.*
allow dashboard from = localhost 10.*
allow mcp from = localhost 10.*
allow streaming from = 10.*
allow management from = localhost 10.*
