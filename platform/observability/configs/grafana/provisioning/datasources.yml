apiVersion: 1

datasources:
  - name: metrics
    uid: metrics
    type: prometheus
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      timeInterval: 30s

  - name: logs
    uid: logs
    type: loki
    url: http://loki:3100

  - name: security reports
    uid: security-reports
    type: yesoreyeram-infinity-datasource
    access: proxy
    jsonData:
      allowedHosts:
        - https://raw.githubusercontent.com
