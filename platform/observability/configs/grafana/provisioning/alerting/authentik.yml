apiVersion: 1

groups:
  - orgId: 1
    name: authentik
    folder: Alerts
    interval: 1m

    rules:

      # AUTHENTIK MISSING
      # Critical when cAdvisor has not seen authentik_server for 3 minutes.
      - uid: authentik-missing
        title: "Authentik: container missing"
        condition: C
        data:
          - refId: A
            datasourceUid: metrics
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: metrics
              editorMode: code
              expr: |
                absent_over_time(
                  container_memory_usage_bytes{
                    job="cadvisor",
                    service="authentik_server"
                  }[3m]
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A

          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce

          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 0
              refId: C
              type: math

        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Authentik server container has been missing for at least 3 minutes
        labels:
          severity: critical
        isPaused: false
