apiVersion: 1

deleteContactPoints:
  - orgId: 1
    uid: email

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy
        type: webhook
        disableResolveMessage: false
        settings:
          url: https://ntfy.hovirix.dev/grafana?template=grafana
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $NTFY_GRAFANA_TOKEN
          message: |-
            {{ range .Alerts }}{{ .Status | toUpper }}: {{ .Annotations.summary }}
            {{ end }}

policies:
  - orgId: 1
    receiver: ntfy
    group_by:
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
