groups:
  - name: hxlab-alerts
    rules:
      - alert: NodeDown
        expr: up{job="alloy"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: "Alloy has not responded on {{ $labels.instance }} for five minutes."

      - alert: NoNodesReporting
        expr: absent(up{job="alloy"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No nodes are reporting"
          description: "Prometheus cannot scrape any Alloy instance for five minutes."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2?"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2?"}) * 100 < 15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} has less than 15% free space on {{ $labels.instance }}."

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2?"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|cgroup2?"}) * 100 < 8
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk space critically low on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} has less than 8% free space on {{ $labels.instance }}."

      - alert: MemoryCritical
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Critically low memory on {{ $labels.instance }}"
          description: "Less than 5% memory is available on {{ $labels.instance }} for 10 minutes."

      - alert: ContainerOOM
        expr: increase(container_oom_events_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} OOM on {{ $labels.node }}"
          description: "Container {{ $labels.name }} in stack {{ $labels.stack }} experienced an OOM event."

      - alert: ContainerRestartLoop
        expr: increase(container_last_seen[15m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarting on {{ $labels.node }}"
          description: "Container {{ $labels.name }} in stack {{ $labels.stack }} has restarted more than 3 times in 15 minutes."

      - alert: ObservabilityCollectorMissing
        expr: absent(up{job="alloy"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Observability collector is missing"
          description: "No Alloy instances are reachable from Prometheus."
