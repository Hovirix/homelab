apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: database
spec:
  instances: 1

  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-db
      dataChecksums: true

  storage:
    size: 10Gi
    # storageClass: REPLACE_ME_OPTIONAL_STORAGE_CLASS

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
