version: "3"

vars:
  PVE: root@pve.home.hovirix.dev

tasks:
  backup:
    desc: Back up Borgmatic ZFS snapshots off-site
    cmds:
      - ssh -T -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} systemctl start borgmatic.service

  restore:local:
    desc: Interactively roll back one dataset to a Sanoid recovery point
    cmds:
      - ssh -tt -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} /usr/local/sbin/restore local

  restore:offsite:
    desc: Interactively extract a Borg recovery point below /rpool/restore
    cmds:
      - ssh -tt -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} /usr/local/sbin/restore offsite
