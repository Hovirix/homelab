version: "3"

vars:
  PVE: root@pve.home.hovirix.dev

tasks:
  backup:
    desc: Snapshot Swarm data and back it up off-site
    cmds:
      - ssh -T -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} bash -s < operations/scripts/backup.sh

  restore:local:
    desc: Roll back to an explicit local ZFS recovery point
    cmds:
      - ssh -T -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} bash -s -- local < operations/scripts/restore.sh

  restore:offsite:
    desc: Stage an explicit Borg recovery point
    cmds:
      - ssh -T -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} bash -s -- offsite < operations/scripts/restore.sh
