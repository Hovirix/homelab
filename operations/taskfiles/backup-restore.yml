version: "3"

vars:
  PVE: root@pve.home.hovirix.dev
  MENU_GROUP: BACKUP & RESTORE
  MENU_ORDER: 7

tasks:
  backup:
    desc: Back up application ZFS snapshots to off-site Borg storage
    cmds:
      - ssh -T -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} systemctl start borgmatic.service

  restore:local:
    desc: Roll back a selected ZFS dataset and discard newer data and snapshots
    prompt:
      - 'WARNING: Rollback permanently deletes newer data and snapshots !'
      - 'Did you stop all affected workloads ?'
    cmds:
      - ssh -tt -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} /usr/local/sbin/restore local

  restore:offsite:
    desc: 'Restore datasets from one Borg archive (usage: task restore:offsite -- paperless postgres)'
    prompt:
      - 'Remove affected stacks and dependencies, and pause deployments until recovery finishes. Continue?'
    cmds:
      - operations/scripts/swarm.sh assert-unused {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
      - ssh -tt -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} /usr/local/sbin/restore offsite {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  restore:extract:
    desc: Extract a Borg backup without replacing live data
    cmds:
      - ssh -tt -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} /usr/local/sbin/restore extract
