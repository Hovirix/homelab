version: "3"

vars:
  PVE: root@pve.home.hovirix.dev
  MENU_GROUP: BACKUP & RESTORE
  MENU_ORDER: 7

tasks:
  backup:
    desc: Enable and start the off-site backup timer
    cmd: incus exec incus:backup -- systemctl enable --now borgmatic.timer

  restore:
    desc: Restore application files from an off-site Borg archive
    interactive: true
    cmd: incus exec incus:backup -- /usr/local/sbin/restore
