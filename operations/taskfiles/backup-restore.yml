version: "3"

vars:
  PVE: root@pve.home.hovirix.dev
  STACK_FILES:
    map:
      postgres: platform/data/postgres/stack.yml
      vaultwarden: platform/applications/vaultwarden/stack.yml
      paperless: platform/applications/paperless-ngx/stack.yml

tasks:
  backup:
    desc: Snapshot Swarm data and back it up off-site
    cmds:
      - ssh -T -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} bash -s < operations/scripts/backup.sh

  restore:local:
    desc: Roll back to an explicit local ZFS recovery point
    cmds:
      - ssh -T -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} bash -s -- local < operations/scripts/restore.sh

  restore:offsite:
    desc: Stage and verify an explicit Borg recovery point
    cmds:
      - ssh -T -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} bash -s -- offsite < operations/scripts/restore.sh

  restore:cutover:
    desc: 'Cut verified staged data over to the live service (stop stack, swap data, redeploy, verify). Usage: task restore:cutover DATASET=postgres STAGING=rpool/restore/postgres-<ts>'
    env:
      DOCKER_HOST:
        sh: operations/scripts/swarm.sh
    cmds:
      - docker stack rm {{.DATASET}}
      - while [ -n "$(docker stack services {{.DATASET}} -q 2>/dev/null)" ]; do sleep 5; done
      - ssh -T -o BatchMode=yes -o ConnectTimeout=10 {{.PVE}} bash -s -- cutover {{.DATASET}} {{.STAGING}} < operations/scripts/restore.sh
      - docker stack deploy --resolve-image changed --compose-file {{index .STACK_FILES .DATASET}} {{.DATASET}}
      - docker stack services {{.DATASET}}
