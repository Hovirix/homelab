version: "3"

vars:
  MENU_GROUP: BACKUP & RESTORE
  MENU_ORDER: 7

tasks:
  backup:
    desc: Run an off-site backup now
    cmd: incus exec incus:backup -- systemctl start borgmatic.service

  restore:
    desc: Restore application files from a Borg archive
    interactive: true
    prompt: Stop all writers for the selected data. If restoring raw PostgreSQL files, stop PostgreSQL too. Have you done this?
    cmds:
      - incus exec incus:backup -- systemctl stop borgmatic.timer borgmatic.service
      - defer: incus exec incus:backup -- systemctl start borgmatic.timer
      - incus exec incus:backup -- /usr/local/sbin/restore

  restore:local:
    desc: Restore an application directory from a Swarm snapshot
    interactive: true
    prompt: Stop all writers for the selected data. If restoring raw PostgreSQL files, stop PostgreSQL too. Have you done this?
    cmds:
      - incus exec incus:backup -- systemctl stop borgmatic.timer borgmatic.service
      - defer: incus exec incus:backup -- systemctl start borgmatic.timer
      - operations/scripts/restore-local.sh

  restore:postgres:
    desc: Restore PostgreSQL databases and roles from a SQL dump
    interactive: true
    prompt: Stop all database clients and suspend SQL dump scheduling. Keep PostgreSQL and its backup container running. Have you done this?
    env:
      DOCKER_HOST:
        sh: operations/scripts/swarm.sh
    cmd: operations/scripts/restore-postgres.sh
