version: "3"

tasks:
  backup:
    desc: Snapshot Swarm data and back it up off-site
    cmds:
      - operations/scripts/backup.sh

  restore:local:
    desc: Roll back to an explicit local ZFS recovery point
    env:
      PRIMARY_HOST: ssh://deploy@swarm-01.home.hovirix.dev
      MANAGER_HOSTS: >-
        ssh://deploy@swarm-01.home.hovirix.dev ssh://deploy@swarm-02.home.hovirix.dev ssh://deploy@swarm-03.home.hovirix.dev
      ADVERTISE_ADDR: 10.30.0.101
      MANAGER_ENDPOINT: swarm-01.home.hovirix.dev:2377
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm.sh"
    cmds:
      - operations/scripts/restore-local.sh

  restore:offsite:
    desc: Stage an explicit Borg recovery point
    cmds:
      - operations/scripts/restore-offsite.sh
