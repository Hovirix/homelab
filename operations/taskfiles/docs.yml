version: "3"

tasks:
  install:
    desc: Install docs dependencies
    internal: true
    cmds:
      - pnpm install --frozen-lockfile

  dev:
    desc: Run the docs site locally
    deps:
      - install
    cmds:
      - pnpm dev

  build:
    desc: Build the docs site
    deps:
      - install
    cmds:
      - pnpm build

  preview:
    desc: Preview the built docs site
    deps:
      - install
    cmds:
      - pnpm preview
