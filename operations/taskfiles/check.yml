version: "3"

vars:
  SBOM_DIR: "{{.ROOT_DIR}}/.artifacts/sbom"
  POLICY_DIR: "{{.ROOT_DIR}}/security/policy"
  SECURITY_DIR: "{{.ROOT_DIR}}/security"

env:
  TRIVY_CONFIG: "{{.SECURITY_DIR}}/trivy.yaml"
  SYFT_CONFIG: "{{.SECURITY_DIR}}/syft.yaml"

tasks:
  lint:
    desc: Run lint checks
    deps:
      - task: lint:actionlint
      - task: lint:nix
      - task: lint:shellcheck
      - task: lint:ansible-lint
      - task: lint:ansible-playbook
      - task: lint:tflint

  lint:actionlint:
    internal: true
    desc: Lint GitHub Actions workflows
    cmds:
      - actionlint .github/workflows/*.yml

  lint:nix:
    internal: true
    desc: Validate Nix flake
    cmds:
      - nix flake check

  lint:shellcheck:
    internal: true
    desc: Lint shell scripts
    cmds:
      - shellcheck operations/scripts/*.sh

  lint:ansible-lint:
    internal: true
    desc: Lint Ansible code
    dir: "{{.ROOT_DIR}}/infrastructure/ansible"
    cmds:
      - ansible-lint

  lint:ansible-playbook:
    internal: true
    desc: Syntax check Ansible playbooks
    dir: "{{.ROOT_DIR}}/infrastructure/ansible"
    cmds:
      - for playbook in playbooks/*.yml; do ansible-playbook "$playbook" --syntax-check; done

  lint:tflint:
    internal: true
    desc: Lint OpenTofu configuration
    cmds:
      - for: [adguardhome, proxmox, cloudflare, authentik]
        cmd: tflint --chdir "infrastructure/opentofu/stacks/{{.ITEM}}"

  lint:treefmt:
    internal: true
    desc: Check Formatting
    cmd: treefmt --ci

  security:
    desc: Run security checks
    cmds:
      - task: security:secrets
      - task: security:iac
      - task: security:policy
      - task: security:actions
      - task: security:vuln

  security:secrets:
    internal: true
    desc: Scan the repository for secrets
    cmds:
      - trivy fs --scanners secret .

  security:vuln:
    internal: true
    desc: Scan image SBOMs for High and Critical vulnerabilities
    deps:
      - security:sbom
    cmds:
      - for sbom in "{{.SBOM_DIR}}"/*.cdx.json; do grype "sbom:$sbom" --fail-on high; done

  security:iac:
    internal: true
    desc: Scan repository configuration for generic misconfiguration
    cmds:
      - trivy config .

  security:policy:
    internal: true
    desc: Enforce HX Lab platform policy
    cmds:
      - conftest verify --policy "{{.POLICY_DIR}}" "{{.POLICY_DIR}}"
      - conftest test --policy "{{.POLICY_DIR}}" platform/**/stack.yml

  security:actions:
    internal: true
    desc: Analyze GitHub Actions security
    cmds:
      - zizmor .github/workflows

  security:sbom:
    internal: true
    desc: Generate image SBOMs from unique stack image references
    cmds:
      - mkdir -p "{{.SBOM_DIR}}"
      - rm -f "{{.SBOM_DIR}}"/*.cdx.json
      - |
        yq -N -r '.. | select(has("image")) | .image' platform/**/stack.yml |
          sort -u |
          while IFS= read -r image; do
            digest="$(printf '%s' "$image" | sha256sum | cut -d ' ' -f 1)"
            syft "$image" -o cyclonedx-json="{{.SBOM_DIR}}/${digest}.cdx.json"
          done
