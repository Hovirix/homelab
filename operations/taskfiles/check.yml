version: "3"

vars:
  POLICY_DIR: "{{.ROOT_DIR}}/security/policy"

tasks:
  lint:
    desc: Run lint checks
    deps:
      - task: lint:actionlint
      - task: lint:nix
      - task: lint:shellcheck
      - task: lint:ansible-lint
      - task: lint:ansible-playbook
      - task: lint:tflint

  lint:actionlint:
    internal: true
    desc: Lint GitHub Actions workflows
    cmds:
      - actionlint .github/workflows/*.yml

  lint:nix:
    internal: true
    desc: Validate Nix flake
    cmds:
      - nix flake check

  lint:shellcheck:
    internal: true
    desc: Lint shell scripts
    cmds:
      - shellcheck operations/scripts/*.sh

  lint:ansible-lint:
    internal: true
    desc: Lint Ansible code
    dir: "{{.ROOT_DIR}}/infrastructure/ansible"
    cmds:
      - ansible-lint

  lint:ansible-playbook:
    internal: true
    desc: Syntax check Ansible playbooks
    dir: "{{.ROOT_DIR}}/infrastructure/ansible"
    cmds:
      - for playbook in playbooks/*.yml; do ansible-playbook "$playbook" --syntax-check; done

  lint:tflint:
    internal: true
    desc: Lint OpenTofu configuration
    cmds:
      - for: [adguardhome, proxmox, cloudflare, authentik]
        cmd: tflint --chdir "infrastructure/opentofu/stacks/{{.ITEM}}"

  lint:treefmt:
    internal: true
    desc: Check Formatting
    cmd: treefmt --ci

  security:
    desc: Run security checks
    cmds:
      - mkdir -p .artifacts/security
      - printf '\nSecurity\n'
      - printf '────────────────────────────────────────────────────────────\n'
      - task: security:secrets
      - task: security:iac
      - task: security:policy
      - task: security:actions

      - printf '\nSBOM\n'
      - printf '────────────────────────────────────────────────────────────\n'
      - task: security:sbom

      - printf '\nVulnerabilities\n'
      - printf '────────────────────────────────────────────────────────────\n'
      - task: security:vuln

  security:secrets:
    internal: true
    cmds:
      - trivy fs --config security/trivy.yaml --scanners secret --format json --output .artifacts/security/trivy-secrets.json .
      - printf '✓ Secrets\n'

  security:iac:
    internal: true
    env:
      TF_VAR_opentofu_state_encryption_passphrase: trivy-placeholder
    cmds:
      - trivy config --config security/trivy.yaml --format json --output .artifacts/security/trivy-iac.json .
      - printf '✓ IaC\n'

  security:policy:
    internal: true
    cmds:
      - conftest verify --policy "{{.POLICY_DIR}}" > .artifacts/security/conftest-verify.txt
      - conftest test --policy "{{.POLICY_DIR}}" --output json platform/*/stack.yml platform/*/*/stack.yml > .artifacts/security/conftest-policy.json
      - printf '✓ Policy\n'

  security:actions:
    internal: true
    cmds:
      - zizmor --quiet --format=json-v1 .github/workflows > .artifacts/security/zizmor.json
      - printf '✓ Actions\n'

  security:sbom:
    internal: true
    cmds:
      - operations/scripts/security-sbom.sh

  security:vuln:
    internal: true
    cmds:
      - operations/scripts/security-vuln.sh
