version: "3"

tasks:
  lint:
    desc: Run lint checks
    deps:
      - lint:actionlint
      - lint:nix
      - lint:python
      - lint:shellcheck
      - lint:ansible
      - lint:tofu
      - lint:butane
      - lint:docker
      - lint:treefmt

  lint:actionlint:
    internal: true
    cmd: actionlint .github/workflows/*.yml

  lint:nix:
    internal: true
    cmd: nix flake check --quiet

  lint:python:
    internal: true
    cmd: ruff check operations/scripts/*.py

  lint:shellcheck:
    internal: true
    cmd: shellcheck operations/scripts/*.sh

  lint:ansible:
    internal: true
    dir: infrastructure/ansible
    cmd: ansible-lint -q

  lint:tofu:
    internal: true
    cmds:
      - for: [adguardhome, proxmox, cloudflare]
        cmd: |
          export TF_DATA_DIR=".artifacts/tofu/{{.ITEM}}"
          cd infrastructure/opentofu/stacks/{{.ITEM}}
          tflint
          tofu init -backend=false -input=false -lockfile=readonly -no-color > /dev/null
          tofu validate -no-color > /dev/null

  lint:butane:
    internal: true
    cmd: butane --strict infrastructure/opentofu/stacks/proxmox/fcos/fcos.bu > /dev/null

  lint:docker:
    internal: true
    method: none
    sources:
      - platform/**/stack.yml
    cmds:
      - for: sources
        cmd: docker stack config -c {{.ITEM}} > /dev/null

  lint:treefmt:
    internal: true
    cmd: treefmt --ci --quiet

  security:
    desc: Run security checks
    cmds:
      - mkdir -p .artifacts/security
      - printf '\nSecurity\n'
      - printf '────────────────────────────────────────────────────────────\n'
      - trivy fs --quiet --config security/trivy.yaml --scanners secret --format json --output .artifacts/security/trivy-secrets.json .
      - printf '✓ Secrets\n'
      - task: security:iac
      - task: security:policy
      - zizmor --quiet --format=json-v1 .github/workflows > .artifacts/security/zizmor.json
      - printf '✓ Actions\n'

      - printf '\nSBOM\n'
      - printf '────────────────────────────────────────────────────────────\n'
      - operations/scripts/security-sbom.sh

      - printf '\nVulnerabilities\n'
      - printf '────────────────────────────────────────────────────────────\n'
      - operations/scripts/security-vuln.sh

  security:iac:
    internal: true
    env:
      TF_VAR_opentofu_state_encryption_passphrase: trivy-placeholder
    cmds:
      - trivy config --quiet --config security/trivy.yaml --format json --output .artifacts/security/trivy-iac.json .
      - printf '✓ IaC\n'

  security:policy:
    internal: true
    shopt: [globstar]
    cmds:
      - conftest verify --policy security/policy > .artifacts/security/conftest-verify.txt
      - conftest test --policy security/policy --output json platform/**/stack.yml > .artifacts/security/conftest-policy.json
      - printf '✓ Policy\n'
