version: "3"

vars:
  MENU_GROUP: VALIDATION
  MENU_ORDER: 2

env:
  TRIVY_CONFIG: security/trivy.yaml

tasks:
  test:
    desc: Check infrastructure drift and service health
    cmd: ./operations/scripts/test.py

  lint:
    desc: Check code and configuration
    deps:
      - lint:actionlint
      - lint:nix
      - lint:python
      - lint:shellcheck
      - lint:ansible
      - lint:tofu
      - lint:butane
      - lint:docker
      - lint:treefmt

  lint:actionlint:
    internal: true
    cmd: actionlint .github/workflows/*.yml

  lint:nix:
    internal: true
    cmd: nix flake check --quiet

  lint:python:
    internal: true
    cmd: ruff check operations/scripts/*.py

  lint:shellcheck:
    internal: true
    cmd: shellcheck operations/scripts/*.sh

  lint:ansible:
    internal: true
    dir: infrastructure/ansible
    cmd: ansible-lint -q

  lint:tofu:
    internal: true
    cmds:
      - for: [adguardhome, proxmox, cloudflare, hetzner]
        cmd: |
          export TF_DATA_DIR=".artifacts/tofu/{{.ITEM}}"
          cd infrastructure/opentofu/stacks/{{.ITEM}}
          tflint
          tofu init -backend=false -input=false -lockfile=readonly -no-color > /dev/null
          tofu validate -no-color > /dev/null

  lint:butane:
    internal: true
    dir: infrastructure/opentofu/stacks/proxmox
    method: none
    sources:
      - fcos/swarm-*.bu
    cmds:
      - for: sources
        cmd: butane --strict --files-dir fcos {{.ITEM}} > /dev/null

  lint:docker:
    internal: true
    method: none
    sources:
      - platform/**/stack.yml
    cmds:
      - for: sources
        cmd: docker stack config -c {{.ITEM}} > /dev/null

  lint:treefmt:
    internal: true
    cmd: treefmt --ci --quiet

  security:
    desc: Run all security checks
    deps:
      - security:static
      - security:images

  security:static:
    desc: Scan configuration, policies, and secrets
    deps:
      - security:ci
      - security:policies
      - security:iac
      - security:secrets

  security:prepare:
    internal: true
    run: once
    cmd: mkdir -p .artifacts/security/sarif

  security:ci:
    deps: ['security:prepare']
    cmd: zizmor --offline --quiet --format=sarif .github/workflows > .artifacts/security/sarif/ci.sarif

  security:iac:
    deps: ['security:prepare']
    env:
      TF_VAR_opentofu_state_encryption_passphrase: trivy-placeholder
    cmd: trivy config --exit-code 1 --format sarif --output .artifacts/security/sarif/iac.sarif .

  security:policies:
    shopt: [globstar]
    cmds:
      - conftest verify --quiet --policy security/policy
      - conftest test --quiet --policy security/policy platform/**/stack.yml

  security:secrets:
    deps: ['security:prepare']
    cmd: trivy fs --scanners secret --exit-code 1 --format sarif --output .artifacts/security/sarif/secrets.sarif .

  security:images:
    desc: Scan container images for vulnerabilities
    cmd: |
      scan_status=0
      operations/scripts/security-scan.py || scan_status=$?
      operations/scripts/security-report.py || exit $?
      exit "$scan_status"

  security:scan:
    deps: ['security:prepare']
    cmd: operations/scripts/security-scan.py

  security:report:
    cmd: operations/scripts/security-report.py
