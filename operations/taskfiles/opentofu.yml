version: "3"

vars:
  tofu_dir: infrastructure/opentofu
  env: '{{default "prod" .env}}'
  stack_dir: "{{.tofu_dir}}/stacks/{{.env}}/{{.stack}}"
  sops_file: "{{.ROOT_DIR}}/secrets/infrastructure.sops.yaml"

tasks:
  tofu:
    internal: true
    dir: "{{.stack_dir}}"
    cmds:
      - '{{.ROOT_DIR}}/operations/scripts/tofu.sh {{.cmd}} "{{.sops_file}}" {{.args}}'

  init:
    desc: Initialize an OpenTofu stack
    cmds:
      - task: tofu
        vars:
          cmd: init

  validate:
    desc: Validate an OpenTofu stack
    cmds:
      - task: tofu
        vars:
          cmd: validate

  plan:
    desc: Plan an OpenTofu stack
    cmds:
      - task: tofu
        vars:
          cmd: plan

  apply:
    desc: Apply an OpenTofu stack
    cmds:
      - task: tofu
        vars:
          cmd: apply

  destroy:
    desc: Destroy an OpenTofu stack
    cmds:
      - task: tofu
        vars:
          cmd: destroy
