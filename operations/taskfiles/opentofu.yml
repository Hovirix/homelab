version: "3"

tasks:
  tofu:
    desc: Run any OpenTofu command for a stack
    vars:
      stack_dir: infrastructure/opentofu/stacks/{{.stack}}
    dir: "{{.stack_dir}}"
    cmds:
      - "{{.ROOT_DIR}}/operations/scripts/tofu.sh {{.ROOT_DIR}}/secrets/infrastructure.sops.yaml {{.CLI_ARGS}}"

  infrastructure:plan:
    desc: Plan infrastructure stacks in dependency order
    cmds:
      - task: tofu
        vars:
          stack: adguardhome
          CLI_ARGS: plan
      - task: tofu
        vars:
          stack: cloudflare
          CLI_ARGS: plan
      - task: tofu
        vars:
          stack: authentik
          CLI_ARGS: plan

  infrastructure:apply:
    desc: Apply infrastructure stacks in dependency order
    cmds:
      - task: tofu
        vars:
          stack: adguardhome
          CLI_ARGS: apply
      - task: tofu
        vars:
          stack: cloudflare
          CLI_ARGS: apply
      - task: tofu
        vars:
          stack: authentik
          CLI_ARGS: apply

  infrastructure:destroy:
    desc: Destroy infrastructure stacks in reverse dependency order
    cmds:
      - task: tofu
        vars:
          stack: authentik
          CLI_ARGS: destroy
      - task: tofu
        vars:
          stack: cloudflare
          CLI_ARGS: destroy
      - task: tofu
        vars:
          stack: adguardhome
          CLI_ARGS: destroy
