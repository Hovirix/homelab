version: "3"

tasks:
  all:
    desc: Update all repo dependencies
    deps:
      - nix
      - docs

  nix:
    desc: Update Nix flake inputs
    cmds:
      - nix flake update

  docs:
    desc: Update docs dependencies
    cmds:
      - pnpm --dir docs update

  check:
    desc: Validate the repository after updates
    cmds:
      - task: :checks:check:ci
