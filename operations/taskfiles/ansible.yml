version: "3"

tasks:
  hosts:
    desc: Configure hosts with Ansible
    cmds:
      - ansible-playbook playbooks/hosts.yml {{.args}}

  pve:
    desc: Configure Proxmox VE nodes with Ansible
    cmds:
      - ansible-playbook playbooks/pve.yml {{.args}}

  datacenter:
    desc: Configure Proxmox VE datacenter with Ansible
    cmds:
      - ansible-playbook playbooks/datacenter.yml {{.args}}

  site:
    desc: Apply full Ansible site configuration
    cmds:
      - ansible-playbook playbooks/site.yml {{.args}}
