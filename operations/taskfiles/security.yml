version: "3"

vars:
  SBOM_DIR: "{{.ROOT_DIR}}/.artifacts/sbom"
  SECURITY_DIR: "{{.ROOT_DIR}}/security"

env:
  TRIVY_CONFIG: "{{.SECURITY_DIR}}/trivy.yaml"
  SYFT_CONFIG: "{{.SECURITY_DIR}}/syft.yaml"

tasks:
  secrets:
    desc: Scan the repository for secrets
    cmds:
      - trivy fs --scanners secret .

  vuln:
    desc: Scan the repository for vulnerabilities
    deps:
      - sbom
    cmds:
      - trivy sbom --scanners vuln "{{.SBOM_DIR}}/infrastructure.cdx.json"
      - trivy sbom --scanners vuln "{{.SBOM_DIR}}/operations.cdx.json"
      - trivy sbom --scanners vuln "{{.SBOM_DIR}}/platform.cdx.json"
      - trivy sbom --scanners vuln "{{.SBOM_DIR}}/docs.cdx.json"

  iac:
    desc: Scan infrastructure and platform configuration
    cmds:
      - trivy config infrastructure
      - trivy config platform

  kubernetes:
    desc: Validate rendered Kubernetes manifests
    cmds:
      - kustomize build platform/clusters/prod | kubeconform -strict -summary -ignore-missing-schemas

  sbom:
    desc: Generate local SBOMs with syft
    cmds:
      - mkdir -p "{{.SBOM_DIR}}"
      - syft dir:infrastructure -o cyclonedx-json="{{.SBOM_DIR}}/infrastructure.cdx.json"
      - syft dir:operations -o cyclonedx-json="{{.SBOM_DIR}}/operations.cdx.json"
      - syft dir:platform -o cyclonedx-json="{{.SBOM_DIR}}/platform.cdx.json"
      - syft dir:docs -o cyclonedx-json="{{.SBOM_DIR}}/docs.cdx.json"

  all:
    desc: Run all local security checks
    cmds:
      - task: secrets
      - task: vuln
      - task: iac
      - task: kubernetes
