version: "3"

vars:
  sbom_dir: "{{.ROOT_DIR}}/.artifacts/sbom"
  security_dir: "{{.ROOT_DIR}}/security"

tasks:
  secrets:
    desc: Scan the repository for secrets
    cmds:
      - trivy --config "{{.security_dir}}/trivy.yaml" fs --scanners secret .

  vuln:
    desc: Scan the repository for vulnerabilities
    deps:
      - sbom
    cmds:
      - trivy --config "{{.security_dir}}/trivy.yaml" sbom --scanners vuln "{{.sbom_dir}}/infrastructure.cdx.json"
      - trivy --config "{{.security_dir}}/trivy.yaml" sbom --scanners vuln "{{.sbom_dir}}/operations.cdx.json"
      - trivy --config "{{.security_dir}}/trivy.yaml" sbom --scanners vuln "{{.sbom_dir}}/platform.cdx.json"
      - trivy --config "{{.security_dir}}/trivy.yaml" sbom --scanners vuln "{{.sbom_dir}}/docs.cdx.json"

  iac:
    desc: Scan infrastructure and platform configuration
    cmds:
      - trivy --config "{{.security_dir}}/trivy.yaml" config infrastructure
      - trivy --config "{{.security_dir}}/trivy.yaml" config platform

  kubernetes:
    desc: Validate rendered Kubernetes manifests
    cmds:
      - kustomize build platform | kubeconform -strict -summary -ignore-missing-schemas

  sbom:
    desc: Generate local SBOMs with syft
    cmds:
      - mkdir -p "{{.sbom_dir}}"
      - syft --config "{{.security_dir}}/syft.yaml" dir:infrastructure -o cyclonedx-json="{{.sbom_dir}}/infrastructure.cdx.json"
      - syft --config "{{.security_dir}}/syft.yaml" dir:operations -o cyclonedx-json="{{.sbom_dir}}/operations.cdx.json"
      - syft --config "{{.security_dir}}/syft.yaml" dir:platform -o cyclonedx-json="{{.sbom_dir}}/platform.cdx.json"
      - syft --config "{{.security_dir}}/syft.yaml" dir:docs -o cyclonedx-json="{{.sbom_dir}}/docs.cdx.json"

  all:
    desc: Run all local security checks
    cmds:
      - task: secrets
      - task: vuln
      - task: iac
      - task: kubernetes
