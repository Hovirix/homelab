version: "3"

vars:
  CONFIG_DIR: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/talos"

env:
  TALOSCONFIG: "{{.CONFIG_DIR}}/talosconfig"
  KUBECONFIG: "{{.CONFIG_DIR}}/kubeconfig"

tasks:
  bootstrap:
    desc: Bootstrap the cluster
    cmds:
      - task: cni
      - task: flux
      - task: sops-key

  reconcile:
    desc: Reconcile the GitOps state
    silent: true
    cmds:
      - flux reconcile source git flux-system
      - flux reconcile kustomization platform

  cni:
    internal: true
    silent: true
    desc: Install Cilium
    cmds:
      - "{{.ROOT_DIR}}/operations/scripts/install-cilium.sh"

  flux:
    internal: true
    silent: true
    desc: Install Flux controllers
    cmds:
      - "{{.ROOT_DIR}}/operations/scripts/bootstrap-flux.sh"

  sops-key:
    internal: true
    silent: true
    desc: Apply SOPS Age key
    cmds:
      - "{{.ROOT_DIR}}/operations/scripts/apply-sops-key.sh"
