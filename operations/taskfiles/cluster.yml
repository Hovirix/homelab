version: "3"

tasks:
  bootstrap:
    desc: Bootstrap the cluster
    cmds:
      - task: cni
      - task: flux
      - task: sops-key

  reconcile:
    desc: Reconcile the GitOps state
    silent: true
    cmds:
      - flux reconcile kustomization flux-system --with-source

  cni:
    internal: true
    silent: true
    desc: Install Cilium
    cmds:
      - "{{.ROOT_DIR}}/operations/scripts/install-cilium.sh"

  flux:
    internal: true
    silent: true
    desc: Install Flux controllers
    cmds:
      - "{{.ROOT_DIR}}/operations/scripts/bootstrap-flux.sh"

  sops-key:
    internal: true
    silent: true
    desc: Apply SOPS Age key
    cmds:
      - "{{.ROOT_DIR}}/operations/scripts/apply-sops-key.sh"
