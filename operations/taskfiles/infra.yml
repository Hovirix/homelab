version: "3"

vars:
  STACKS: [adguardhome, proxmox, access]

tasks:
  init:
    internal: true
    cmds:
      - for:
          var: STACKS
        task: stack
        vars:
          STACK: "{{.ITEM}}"
          ARGS: init

  plan:
    desc: Preview infrastructure changes
    deps: [fcos-render, init]
    cmds:
      - for:
          var: STACKS
        task: stack
        vars:
          STACK: "{{.ITEM}}"
          ARGS: plan

  apply:
    desc: Apply infrastructure changes
    prompt: Apply infrastructure changes?
    deps: [fcos-render, init]
    cmds:
      - for:
          var: STACKS
        task: stack
        vars:
          STACK: "{{.ITEM}}"
          ARGS: apply -auto-approve

  destroy:
    desc: Destroy managed infrastructure
    prompt: "Destroy managed infrastructure? This is destructive."
    deps: [init]
    cmds:
      - for: [access, proxmox, adguardhome]
        task: stack
        vars:
          STACK: "{{.ITEM}}"
          ARGS: destroy -auto-approve

  fcos-render:
    internal: true
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/proxmox/build"
      - butane --strict "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/proxmox/fcos/fcos.bu" > "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/proxmox/build/fcos.ign"

  stack:
    internal: true
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/{{.STACK}}"
    requires:
      vars: [STACK, ARGS]
    cmds:
      - "{{.ROOT_DIR}}/operations/scripts/tofu.sh {{.ROOT_DIR}}/secrets/infrastructure.sops.yaml {{.ARGS}}"
