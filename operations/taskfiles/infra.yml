version: "3"

vars:
  MENU_GROUP: INFRASTRUCTURE
  MENU_ORDER: 3

tasks:
  incusos:backup:
    desc: Export and SOPS-encrypt IncusOS configuration and state
    cmd: operations/scripts/incusos-backup.sh backup

  incusos:keys:
    desc: Export and SOPS-encrypt IncusOS recovery and pool keys
    cmd: operations/scripts/incusos-backup.sh keys

  incusos:image:
    desc: Build IncusOS USB image
    cmd: secretspec run -P production -S incusos -- operations/scripts/incusos-image.sh

  fcos:render:
    internal: true
    dir: infrastructure/incus
    cmds:
      - mkdir -p build
      - for: [swarm-01, swarm-02, swarm-03]
        cmd: butane --strict --files-dir fcos fcos/{{.ITEM}}.bu > build/{{.ITEM}}.ign

  fcos:build:
    internal: true
    deps: ['fcos:render']
    desc: Build Fedora CoreOS image
    sources:
      - operations/scripts/fcos-image.sh
    generates:
      - infrastructure/incus/build/fcos-proxmoxve.qcow2
      - infrastructure/incus/build/metadata.tar
    cmds:
      - operations/scripts/fcos-image.sh

  incus:plan:
    desc: Preview Incus infrastructure changes
    deps: ['fcos:build']
    dir: infrastructure/incus
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu plan

  incus:apply:
    desc: Apply Incus infrastructure changes
    deps: ['fcos:build']
    dir: infrastructure/incus
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu apply -auto-approve

  plan:
    desc: Preview infrastructure changes
    deps:
      - incus:plan
      - cloudflare:plan
      - hetzner:plan

  apply:
    desc: Apply infrastructure changes
    prompt: Apply infrastructure changes?
    cmds:
      - task: incus:apply
      - task: cloudflare:apply
      - task: hetzner:apply

  cloudflare:plan:
    dir: infrastructure/cloudflare
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu plan

  cloudflare:apply:
    dir: infrastructure/cloudflare
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu apply -auto-approve

  cloudflare:destroy:
    dir: infrastructure/cloudflare
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu destroy -auto-approve

  hetzner:apply:
    dir: infrastructure/hetzner
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu apply -auto-approve

  hetzner:plan:
    dir: infrastructure/hetzner
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu plan

  hetzner:destroy:
    dir: infrastructure/hetzner
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu destroy -auto-approve
