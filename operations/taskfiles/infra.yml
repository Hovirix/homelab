version: "3"

tasks:
  plan:
    desc: Preview infrastructure changes
    deps:
      - adguardhome:plan
      - proxmox:plan
      - cloudflare:plan
      - hetzner:plan

  apply:
    desc: Apply infrastructure changes
    prompt: Apply infrastructure changes?
    cmds:
      - task: adguardhome:apply
      - task: proxmox:apply
      - task: cloudflare:apply
      - task: hetzner:apply

  adguardhome:plan:
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/adguardhome"
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu plan

  adguardhome:apply:
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/adguardhome"
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu apply -auto-approve

  adguardhome:destroy:
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/adguardhome"
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu destroy -auto-approve

  proxmox:plan:
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/proxmox"
    deps: [fcos-render]
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu plan

  proxmox:apply:
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/proxmox"
    deps: [fcos-render]
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu apply -auto-approve

  proxmox:destroy:
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/proxmox"
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu destroy -auto-approve

  cloudflare:plan:
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/cloudflare"
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu plan

  cloudflare:apply:
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/cloudflare"
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu apply -auto-approve

  cloudflare:destroy:
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/cloudflare"
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu destroy -auto-approve

  hetzner:apply:
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/hetzner"
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu apply -auto-approve

  hetzner:plan:
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/hetzner"
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu plan

  hetzner:destroy:
    dir: "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/hetzner"
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu destroy -auto-approve

  fcos-render:
    internal: true
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/proxmox/build"
      - butane --strict "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/proxmox/fcos/fcos.bu" > "{{.ROOT_DIR}}/infrastructure/opentofu/stacks/proxmox/build/fcos.ign"
