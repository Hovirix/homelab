version: "3"

vars:
  MENU_GROUP: INFRASTRUCTURE
  MENU_ORDER: 3

tasks:
  plan:
    desc: Preview infrastructure changes with OpenTofu
    deps:
      - adguardhome:plan
      - proxmox:plan
      - cloudflare:plan
      - hetzner:plan

  apply:
    desc: Apply infrastructure changes with OpenTofu
    prompt: Apply infrastructure changes?
    cmds:
      - task: adguardhome:apply
      - task: proxmox:apply
      - task: cloudflare:apply
      - task: hetzner:apply

  adguardhome:plan:
    cmds:
      - task: stack:run
        vars: {STACK: adguardhome, ARGS: plan}

  adguardhome:apply:
    cmds:
      - task: stack:run
        vars: {STACK: adguardhome, ARGS: apply -auto-approve}

  adguardhome:destroy:
    cmds:
      - task: stack:run
        vars: {STACK: adguardhome, ARGS: destroy -auto-approve}

  proxmox:plan:
    deps: [fcos-render]
    cmds:
      - task: stack:run
        vars: {STACK: proxmox, ARGS: plan}

  proxmox:apply:
    deps: [fcos-render]
    cmds:
      - task: stack:run
        vars: {STACK: proxmox, ARGS: apply -auto-approve}

  proxmox:destroy:
    cmds:
      - task: stack:run
        vars: {STACK: proxmox, ARGS: destroy -auto-approve}

  cloudflare:plan:
    cmds:
      - task: stack:run
        vars: {STACK: cloudflare, ARGS: plan}

  cloudflare:apply:
    cmds:
      - task: stack:run
        vars: {STACK: cloudflare, ARGS: apply -auto-approve}

  cloudflare:destroy:
    cmds:
      - task: stack:run
        vars: {STACK: cloudflare, ARGS: destroy -auto-approve}

  hetzner:apply:
    cmds:
      - task: stack:run
        vars: {STACK: hetzner, ARGS: apply -auto-approve}

  hetzner:plan:
    cmds:
      - task: stack:run
        vars: {STACK: hetzner, ARGS: plan}

  hetzner:destroy:
    cmds:
      - task: stack:run
        vars: {STACK: hetzner, ARGS: destroy -auto-approve}

  stack:run:
    internal: true
    dir: infrastructure/opentofu/stacks/{{.STACK}}
    cmds:
      - secretspec run -P production -S opentofu -- tofu init >/dev/null
      - secretspec run -P production -S opentofu -- tofu {{.ARGS}}

  fcos-render:
    internal: true
    dir: infrastructure/opentofu/stacks/proxmox
    cmds:
      - mkdir -p build
      - butane --strict --files-dir fcos fcos/swarm-01.bu > build/swarm-01.ign
      - butane --strict --files-dir fcos fcos/swarm-02.bu > build/swarm-02.ign
      - butane --strict --files-dir fcos fcos/swarm-03.bu > build/swarm-03.ign
