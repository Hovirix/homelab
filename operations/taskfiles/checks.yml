version: "3"

tasks:
  all:
    desc: Run all local checks
    cmds:
      - task: flake
      - task: shellcheck
      - task: secrets
      - task: ansible-lint
      - task: ansible-syntax
      - task: tflint

  fmt:
    desc: Format the repository with nix fmt
    cmds:
      - nix fmt

  flake:
    desc: Evaluate flake checks
    cmds:
      - nix flake check

  secrets:
    desc: Scan the repository for secrets
    cmds:
      - task: :security:secrets

  shellcheck:
    desc: Lint operation shell scripts
    cmds:
      - find operations/scripts -type f -exec shellcheck {} +

  ansible-lint:
    desc: Lint Ansible content
    dir: infrastructure/ansible
    cmds:
      - ansible-lint

  ansible-syntax:
    desc: Run Ansible playbook syntax checks
    dir: infrastructure/ansible
    cmds:
      - for playbook in playbooks/*.yml; do ansible-playbook "$playbook" --syntax-check; done

  tflint:
    desc: Lint OpenTofu stacks
    dir: infrastructure/opentofu/stacks
    cmds:
      - for stack in adguardhome authentik cloudflare clusters/*; do [ ! -d "$stack" ] || tflint --chdir="$stack"; done
