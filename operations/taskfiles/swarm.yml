version: "3"

vars:
  SWARM_PRIMARY: swarm-01
  SWARM_JOIN_HOSTS: >-
    swarm-02 swarm-03
  SWARM_ADVERTISE_ADDR: 10.40.0.101
  SWARM_MANAGER_ENDPOINT: "{{.SWARM_PRIMARY}}.home.hovirix.dev:2377"

tasks:
  init:
    desc: Initialize the Swarm and join the remaining managers
    env:
      SWARM_PRIMARY: "{{.SWARM_PRIMARY}}"
      SWARM_JOIN_HOSTS: "{{.SWARM_JOIN_HOSTS}}"
      SWARM_ADVERTISE_ADDR: "{{.SWARM_ADVERTISE_ADDR}}"
      SWARM_MANAGER_ENDPOINT: "{{.SWARM_MANAGER_ENDPOINT}}"
    cmds:
      - "{{.ROOT_DIR}}/operations/scripts/swarm-init.sh"

  status:
    desc: Show the Swarm nodes
    cmds:
      - ssh {{.SWARM_PRIMARY}} sudo docker node ls
