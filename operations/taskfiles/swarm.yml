version: "3"

env:
  PRIMARY_HOST: ssh://deploy@swarm-01.home.hovirix.dev
  MANAGER_HOSTS: >-
    ssh://deploy@swarm-01.home.hovirix.dev ssh://deploy@swarm-02.home.hovirix.dev ssh://deploy@swarm-03.home.hovirix.dev
  ADVERTISE_ADDR: 10.30.0.101
  MANAGER_ENDPOINT: swarm-01.home.hovirix.dev:2377

tasks:
  init:
    desc: Create the Docker Swarm and join its managers
    cmds:
      - operations/scripts/swarm.sh init

  status:
    desc: Show Docker Swarm manager state
    cmds:
      - operations/scripts/swarm.sh status

  rebuild:
    desc: Recreate Docker Swarm
    cmds:
      - operations/scripts/swarm.sh rebuild
