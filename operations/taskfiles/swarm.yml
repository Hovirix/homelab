version: "3"

vars:
  MENU_GROUP: PLATFORM
  MENU_ORDER: 5

env:
  PRIMARY_HOST: ssh://deploy@swarm-01.home.hovirix.dev
  ADVERTISE_ADDR: 10.30.0.101
  MANAGER_ENDPOINT: swarm-01.home.hovirix.dev:2377

tasks:
  status:
    desc: Show Swarm nodes and manager status
    cmds:
      - operations/scripts/swarm.sh status

  drain:
    desc: Drain all nodes and wait for Swarm services to stop
    prompt: All Swarm services will stop, and nodes will remain drained. Drain all Swarm nodes?
    cmd: operations/scripts/swarm.sh drain

  activate:
    desc: Reactivate all nodes so Swarm services can resume
    prompt: Swarm services can resume after nodes are activated. Activate all Swarm nodes?
    cmd: operations/scripts/swarm.sh activate

  init:
    desc: Initialize the Swarm cluster
    cmds:
      - operations/scripts/swarm.sh init

  rebuild:
    desc: Recreate the Swarm cluster and remove services
    prompt: All managers will leave Swarm, and deployed services will be removed. Recreate the Swarm cluster?
    cmds:
      - operations/scripts/swarm.sh rebuild
