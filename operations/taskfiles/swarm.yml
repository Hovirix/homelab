version: "3"

vars:
  MENU_GROUP: SWARM
  MENU_ORDER: 5

env:
  PRIMARY_HOST: ssh://deploy@swarm-01.home.hovirix.dev
  ADVERTISE_ADDR: 10.30.0.101
  MANAGER_ENDPOINT: swarm-01.home.hovirix.dev:2377

tasks:
  status:
    desc: Show nodes and manager status
    cmds:
      - operations/scripts/swarm.sh status

  init:
    desc: Initialize the cluster
    cmds:
      - operations/scripts/swarm.sh init

  rebuild:
    desc: Recreate the cluster — destructive
    prompt: This forces all managers to leave Swarm and removes deployed services. Recreate the cluster?
    cmds:
      - operations/scripts/swarm.sh rebuild
