version: "3"

tasks:
  init:
    desc: Initialize the Docker Swarm
    env:
      SWARM_JOIN_DOCKER_HOSTS: ssh://deploy@swarm-02.home.hovirix.dev ssh://deploy@swarm-03.home.hovirix.dev
      SWARM_ADVERTISE_ADDR: 10.40.0.101
      SWARM_MANAGER_ENDPOINT: swarm-01.home.hovirix.dev:2377
    cmds:
      - operations/scripts/swarm-init.sh

  status:
    desc: Show cluster and node status
    env:
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm-host.sh"
    cmds:
      - docker node ls
