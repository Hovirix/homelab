version: "3"

tasks:
  init:
    desc: Initialize the Swarm and join the remaining managers
    env:
      SWARM_JOIN_DOCKER_HOSTS: ssh://deploy@swarm-02.home.hovirix.dev ssh://deploy@swarm-03.home.hovirix.dev
      SWARM_ADVERTISE_ADDR: 10.40.0.101
      SWARM_MANAGER_ENDPOINT: swarm-01.home.hovirix.dev:2377
    cmds:
      - operations/scripts/swarm-init.sh

  secrets:
    internal: true
    desc: Create missing platform Swarm secrets
    cmds:
      - operations/scripts/swarm-secrets.sh

  deploy:
    desc: Deploy platform stacks
    cmds:
      - task: secrets
      - task: deploy:ingress
      - task: deploy:data
      - task: deploy:authentik
      - task: deploy:observability
      - task: deploy:applications

  deploy:ingress:
    desc: Deploy ingress stack
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/ingress/stack.yml ingress

  deploy:data:
    desc: Deploy data stacks
    cmds:
      - task: deploy:postgres
      - task: deploy:valkey

  deploy:postgres:
    desc: Deploy PostgreSQL stack
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/data/postgres/stack.yml postgres

  deploy:valkey:
    desc: Deploy Valkey stack
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/data/valkey/stack.yml valkey

  deploy:authentik:
    desc: Deploy Authentik stack
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/identity/stack.yml authentik

  deploy:observability:
    desc: Deploy observability stack
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/observability/stack.yml observability

  deploy:applications:
    desc: Deploy application stacks
    cmds:
      - task: deploy:vaultwarden
      - task: deploy:paperless

  deploy:vaultwarden:
    desc: Deploy Vaultwarden stack
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/applications/vaultwarden/stack.yml vaultwarden

  deploy:paperless:
    desc: Deploy Paperless stack
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/applications/paperless-ngx/stack.yml paperless

  logs:
    desc: Show Swarm service logs
    requires:
      vars:
        - STACK
        - SERVICE
    cmds:
      - docker service logs {{.STACK}}_{{.SERVICE}}
