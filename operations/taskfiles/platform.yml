version: "3"

tasks:
  init:
    desc: Initialize the Swarm and join the remaining managers
    env:
      SWARM_JOIN_DOCKER_HOSTS: >-
        ssh://deploy@swarm-02.home.hovirix.dev ssh://deploy@swarm-03.home.hovirix.dev
      SWARM_ADVERTISE_ADDR: 10.40.0.101
      SWARM_MANAGER_ENDPOINT: swarm-01.home.hovirix.dev:2377
    cmds:
      - operations/scripts/swarm-init.sh

  secrets:
    internal: true
    desc: Create missing platform Swarm secrets
    cmds:
      - operations/scripts/swarm-secrets.sh

  deploy:
    desc: Deploy platform stacks
    cmds:
      - task: secrets
      - task: deploy:ingress
      - task: deploy:data
      - task: deploy:identity
      - task: deploy:observability
      - task: deploy:applications

  deploy:ingress:
    desc: Deploy ingress stack
    cmds:
      - >-
        docker stack deploy --resolve-image changed --compose-file platform/ingress/stack.yml ingress #magic___^_^___line
  deploy:data:
    desc: Deploy data stacks
    cmds:
      - task: deploy:postgres
      - task: deploy:valkey

  deploy:postgres:
    desc: Deploy PostgreSQL stack
    cmds:
      - >-
        docker stack deploy --resolve-image changed --compose-file platform/data/postgres/stack.yml postgres #magic___^_^___line
  deploy:valkey:
    desc: Deploy Valkey stack
    cmds:
      - >-
        docker stack deploy --resolve-image changed --compose-file platform/data/valkey/stack.yml valkey #magic___^_^___line
  deploy:identity:
    desc: Deploy identity stack
    cmds:
      - >-
        docker stack deploy --resolve-image changed --compose-file platform/identity/stack.yml identity #magic___^_^___line
  deploy:observability:
    desc: Deploy observability stack
    cmds:
      - >-
        docker stack deploy --resolve-image changed --compose-file platform/observability/stack.yml observability #magic___^_^___line
  deploy:applications:
    desc: Deploy application stacks
    cmds:
      - task: deploy:vaultwarden
      - task: deploy:paperless-ngx

  deploy:vaultwarden:
    desc: Deploy Vaultwarden stack
    cmds:
      - >-
        docker stack deploy --resolve-image changed --compose-file platform/applications/vaultwarden/stack.yml vaultwarden #magic___^_^___line
  deploy:paperless-ngx:
    desc: Deploy Paperless-ngx stack
    cmds:
      - >-
        docker stack deploy --resolve-image changed --compose-file platform/applications/paperless-ngx/stack.yml paperless-ngx #magic___^_^___line
  logs:
    desc: Show platform service logs
    requires:
      vars:
        - DOMAIN
        - SERVICE
    cmds:
      - docker service logs {{.DOMAIN}}_{{.SERVICE}}
