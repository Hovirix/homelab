version: "3"

vars:
  PLATFORM_ROOT: "{{.ROOT_DIR}}/platform"
  STACK_FILE: "{{.PLATFORM_ROOT}}/{{.DOMAIN}}/stack.yml"

tasks:
  init:
    desc: Initialize the Swarm and join the remaining managers
    env:
      SWARM_JOIN_DOCKER_HOSTS: >-
        ssh://deploy@swarm-02.home.hovirix.dev ssh://deploy@swarm-03.home.hovirix.dev
      SWARM_ADVERTISE_ADDR: 10.40.0.101
      SWARM_MANAGER_ENDPOINT: swarm-01.home.hovirix.dev:2377
    cmds:
      - "{{.ROOT_DIR}}/operations/scripts/swarm-init.sh"

  secrets:
    internal: true
    desc: Create missing platform Swarm secrets
    cmds:
      - "{{.ROOT_DIR}}/operations/scripts/swarm-secrets.sh"

  check:
    desc: Validate all platform domain stack files
    cmds:
      - |
        for stack_file in "{{.PLATFORM_ROOT}}"/*/stack.yml; do
          docker stack config --compose-file "$stack_file" >/dev/null
        done

  deploy:
    desc: Deploy a platform domain stack
    deps: [secrets]
    requires:
      vars:
        - DOMAIN
    cmds:
      - docker stack deploy --compose-file "{{.STACK_FILE}}" {{.DOMAIN}}

  logs:
    desc: Show platform domain service logs
    requires:
      vars:
        - DOMAIN
        - SERVICE
    cmds:
      - docker service logs {{.DOMAIN}}_{{.SERVICE}}
