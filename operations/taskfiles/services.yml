version: "3"

vars:
  MENU_GROUP: SERVICES
  MENU_ORDER: 6

tasks:

  deploy:
    internal: true
    env: &docker-env
      DOCKER_HOST:
        sh: operations/scripts/swarm.sh
    vars:
      STACKS:
        - {name: traefik, file: platform/ingress/traefik/stack.yml}
        - {name: cloudflared, file: platform/ingress/cloudflared/stack.yml}
        - {name: postgres, file: platform/data/postgres/stack.yml}
        - {name: valkey, file: platform/data/valkey/stack.yml}
        - {name: authentik, file: platform/identity/stack.yml}
        - {name: observability, file: platform/observability/stack.yml}
        - {name: vaultwarden, file: platform/applications/vaultwarden/stack.yml}
        - {name: paperless, file: platform/applications/paperless-ngx/stack.yml}
    cmds:
      - python operations/scripts/secrets.py
      - for: {var: STACKS}
        cmd: |
          printf '\nDeploying %s\n' '{{.ITEM.name | upper}}:'
          docker stack deploy --detach=false --resolve-image changed --compose-file "{{.ITEM.file}}" "{{.ITEM.name}}"
      - defer: python operations/scripts/secrets.py clean

  status:
    desc: List deployed services, replica counts, and images
    env: *docker-env
    cmds:
      - docker service ls --format 'table {{"{{"}}.Name{{"}}"}}\t{{"{{"}}.Replicas{{"}}"}}\t{{"{{"}}.Image{{"}}"}}'

  logs:
    desc: 'Follow service logs (usage: task services:logs -- authentik_server)'
    env: *docker-env
    preconditions:
      - sh: test -n {{.CLI_ARGS | shellQuote}}
        msg: 'Usage: task services:logs -- authentik_server'
    cmd: docker service logs --follow {{.CLI_ARGS | shellQuote}}
