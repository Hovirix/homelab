version: "3"

tasks:

  secret:sync:
    internal: true
    env: &docker-env
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm.sh"
    # Automatically runs when Task detects production secret changes.
    sources: [secrets/production.sops.env]
    cmd: python3 operations/scripts/secrets.py

  deploy:
    internal: true
    deps: ['secret:sync']
    env: *docker-env
    vars:
      STACKS:
        - {name: traefik, file: platform/ingress/traefik/stack.yml}
        - {name: cloudflared, file: platform/ingress/cloudflared/stack.yml}
        - {name: postgres, file: platform/data/postgres/stack.yml}
        - {name: valkey, file: platform/data/valkey/stack.yml}
        - {name: authentik, file: platform/identity/stack.yml}
        - {name: observability, file: platform/observability/stack.yml}
        - {name: vaultwarden, file: platform/applications/vaultwarden/stack.yml}
        - {name: paperless, file: platform/applications/paperless-ngx/stack.yml}
    cmds:
      - for: {var: STACKS}
        cmd: docker stack deploy --resolve-image changed --compose-file {{.ITEM.file}} {{.ITEM.name}}

  status:
    desc: Show deployed Docker stacks
    env: *docker-env
    cmds:
      - docker stack ls
