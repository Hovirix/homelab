version: "3"

tasks:

  secret:sync:
    internal: true
    # Automatically runs when Task detects production secret changes.
    sources: [secrets/production.sops.env]
    env:
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm.sh"
    cmd: python3 operations/scripts/secrets.py

  deploy:
    internal: true
    deps: ['secret:sync']
    cmds:
      - task: traefik:deploy
      - task: cloudflared:deploy
      - task: postgres:deploy
      - task: valkey:deploy
      - task: authentik:deploy
      - task: observability:deploy
      - task: vaultwarden:deploy
      - task: paperless:deploy

  status:
    desc: Show deployed Docker stacks
    env:
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm.sh"
    cmds:
      - docker stack ls

  traefik:deploy:
    desc: Deploy Traefik
    env:
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm.sh"
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/ingress/traefik/stack.yml traefik

  cloudflared:deploy:
    desc: Deploy Cloudflared
    env:
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm.sh"
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/ingress/cloudflared/stack.yml cloudflared

  postgres:deploy:
    desc: Deploy PostgreSQL
    env:
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm.sh"
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/data/postgres/stack.yml postgres

  valkey:deploy:
    desc: Deploy Valkey
    env:
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm.sh"
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/data/valkey/stack.yml valkey

  authentik:deploy:
    desc: Deploy Authentik
    env:
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm.sh"
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/identity/stack.yml authentik

  observability:deploy:
    desc: Deploy observability
    env:
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm.sh"
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/observability/stack.yml observability

  vaultwarden:deploy:
    desc: Deploy Vaultwarden
    env:
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm.sh"
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/applications/vaultwarden/stack.yml vaultwarden

  paperless:deploy:
    desc: Deploy Paperless
    env:
      DOCKER_HOST:
        sh: "{{.ROOT_DIR}}/operations/scripts/swarm.sh"
    cmds:
      - docker stack deploy --resolve-image changed --compose-file platform/applications/paperless-ngx/stack.yml paperless
