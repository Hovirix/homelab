version: "3"

tasks:
  plan:
    desc: Preview Proxmox VE host/datacenter configuration
    dir: "{{.ROOT_DIR}}/infrastructure/ansible"
    cmds:
      - ansible-playbook playbooks/site.yml --check --diff

  apply:
    desc: Apply Proxmox VE host/datacenter configuration
    dir: "{{.ROOT_DIR}}/infrastructure/ansible"
    cmds:
      - ansible-playbook playbooks/site.yml
