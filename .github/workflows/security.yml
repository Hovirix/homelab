name: security

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    container:
      image: nixos/nix:2.28.5
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
      SYFT_CACHE_DIR: /github/home/.cache/syft
      TRIVY_CACHE_DIR: /github/home/.cache/trivy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache security DBs
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.cache/syft
            /github/home/.cache/trivy
          key: security-${{ runner.os }}-${{ hashFiles('security/syft.yaml', 'security/trivy.yaml', 'flake.lock') }}

      - name: Generate SBOMs
        run: nix develop .#ci --command task security:sbom

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: .artifacts/sbom
          if-no-files-found: warn
          retention-days: 14

      - name: Scan secrets
        run: nix develop .#ci --command task security:secrets

      - name: Scan IaC
        run: nix develop .#ci --command task security:iac

      - name: Validate Kubernetes
        run: nix develop .#ci --command task security:kubernetes

      - name: Scan SBOM vulnerabilities
        run: nix develop .#ci --command task security:vuln
