name: security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      SYFT_CACHE_DIR: /home/runner/.cache/syft
      TRIVY_CACHE_DIR: /home/runner/.cache/trivy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Cache security DBs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/.cache/grype
            /home/runner/.cache/syft
            /home/runner/.cache/trivy
          key: security-${{ runner.os }}-${{ hashFiles('.grype.yaml', '.syft.yaml', 'security/trivy.yaml', 'flake.lock') }}
          restore-keys: |
            security-${{ runner.os }}-

      - name: Run security checks
        run: nix develop .#ci --command task check:security

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: |
            .artifacts/sbom
            .artifacts/security
          if-no-files-found: warn
          retention-days: 14
