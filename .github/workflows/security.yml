name: security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_CACHE_DIR: /home/runner/.cache/trivy
      SECURITY_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
      SECURITY_BASE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Cache Trivy DBs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/trivy
          key: trivy-${{ runner.os }}-${{ hashFiles('security/trivy.yaml', 'flake.lock') }}-${{ github.run_id }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ hashFiles('security/trivy.yaml', 'flake.lock') }}-

      - name: Prepare security tools
        id: tools
        run: nix develop .#ci --command true

      - name: Audit Actions
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: nix develop .#ci --command task check:security:ci

      - name: Check policies
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: nix develop .#ci --command task check:security:policies

      - name: Scan IaC
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: nix develop .#ci --command task check:security:iac

      - name: Scan secrets
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: nix develop .#ci --command task check:security:secrets

      - name: Compare and scan images
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: nix develop .#ci --command task check:security:vuln

      - name: Upload Actions findings
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('.artifacts/security/sarif/ci.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: .artifacts/security/sarif/ci.sarif
          category: zizmor

      - name: Upload IaC findings
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('.artifacts/security/sarif/iac.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: .artifacts/security/sarif/iac.sarif
          category: trivy-iac

      - name: Upload image findings
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('.artifacts/security/sarif/images/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: .artifacts/security/sarif/images

      - name: Upload image reports
        if: ${{ !cancelled() && hashFiles('.artifacts/security/json/images/*.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-security
          path: |
            .artifacts/security/json/images
            .artifacts/security/sarif/images
            .artifacts/security/summary.md
          include-hidden-files: true
          retention-days: 14
