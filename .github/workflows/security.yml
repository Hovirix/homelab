name: security

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      SYFT_CACHE_DIR: /home/runner/.cache/syft
      TRIVY_CACHE_DIR: /home/runner/.cache/trivy
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Cache security DBs
        uses: actions/cache@v6.1.0
        with:
          path: |
            /home/runner/.cache/syft
            /home/runner/.cache/trivy
          key: security-${{ runner.os }}-${{ hashFiles('security/syft.yaml', 'security/trivy.yaml', 'flake.lock') }}
          restore-keys: |
            security-${{ runner.os }}-

      - name: Run security checks
        run: nix develop .#ci --command task security

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom
          path: .artifacts/sbom
          if-no-files-found: warn
          retention-days: 14
