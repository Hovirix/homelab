- name: Create OpenTofu API user
  ansible.builtin.command:
    argv:
      - pveum
      - user
      - add
      - opentofu@pve
      - --comment
      - OpenTofu VM lifecycle
  register: datacenter_api_user
  failed_when:
    - datacenter_api_user.rc != 0
    - "'already exists' not in datacenter_api_user.stderr"
  changed_when: datacenter_api_user.rc == 0
  run_once: true

- name: Assign VM administration permissions
  ansible.builtin.command:
    argv:
      - pveum
      - acl
      - modify
      - /
      - --users
      - opentofu@pve
      - --roles
      - PVEVMAdmin
  changed_when: false
  run_once: true

- name: Assign ISO datastore administration permissions
  ansible.builtin.command:
    argv:
      - pveum
      - acl
      - modify
      - /storage/local
      - --users
      - opentofu@pve
      - --roles
      - PVEDatastoreAdmin
  changed_when: false
  run_once: true

- name: Assign VM disk datastore administration permissions
  ansible.builtin.command:
    argv:
      - pveum
      - acl
      - modify
      - /storage/local-zfs
      - --users
      - opentofu@pve
      - --roles
      - PVEDatastoreAdmin
  changed_when: false
  run_once: true

- name: Assign hardware mapping administration permissions
  ansible.builtin.command:
    argv:
      - pveum
      - acl
      - modify
      - /mapping
      - --users
      - opentofu@pve
      - --roles
      - PVEMappingAdmin
  changed_when: false
  run_once: true

- name: Assign SDN network usage permissions
  ansible.builtin.command:
    argv:
      - pveum
      - acl
      - modify
      - /sdn/zones/localnetwork
      - --users
      - opentofu@pve
      - --roles
      - PVESDNUser
  changed_when: false
  run_once: true

- name: Query Proxmox roles
  ansible.builtin.command:
    argv:
      - pveum
      - role
      - list
      - --output-format
      - json
  register: datacenter_api_roles
  changed_when: false
  run_once: true

- name: Create image download role
  ansible.builtin.command:
    argv:
      - pveum
      - role
      - add
      - OpenTofuDownload
      - --privs
      - Sys.AccessNetwork Sys.Modify
  when: >-
    'OpenTofuDownload' not in ( datacenter_api_roles.stdout | from_json | map(attribute='roleid') | list )
  changed_when: true
  run_once: true

- name: Configure image download role
  ansible.builtin.command:
    argv:
      - pveum
      - role
      - modify
      - OpenTofuDownload
      - --privs
      - Sys.AccessNetwork Sys.Modify
  changed_when: false
  run_once: true

- name: Assign image download permissions
  ansible.builtin.command:
    argv:
      - pveum
      - acl
      - modify
      - "/nodes/{{ inventory_hostname }}"
      - --users
      - opentofu@pve
      - --roles
      - OpenTofuDownload
  changed_when: false
  run_once: true

- name: Create OpenTofu API token
  ansible.builtin.command:
    argv:
      - pveum
      - user
      - token
      - add
      - opentofu@pve
      - opentofu
      - --privsep
      - "0"
      - --comment
      - OpenTofu VM lifecycle
      - --output-format
      - json
  register: datacenter_api_token
  failed_when:
    - datacenter_api_token.rc != 0
    - "'already exists' not in datacenter_api_token.stderr"
  changed_when: datacenter_api_token.rc == 0
  no_log: true
  run_once: true

- name: Display generated OpenTofu API token
  ansible.builtin.debug:
    msg:
      token_id: opentofu@pve!opentofu
      token_secret: "{{ (datacenter_api_token.stdout | from_json).value }}"
  when: datacenter_api_token.rc == 0
  run_once: true
