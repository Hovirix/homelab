- name: Read rpool size
  ansible.builtin.command:
    argv:
      - zpool
      - list
      - -Hp
      - -o
      - size
      - rpool
  register: zfs_rpool_size
  changed_when: false
  check_mode: false

- name: Read rpool health
  ansible.builtin.command:
    argv:
      - zpool
      - list
      - -H
      - -o
      - health
      - rpool
  register: zfs_rpool_health
  changed_when: false
  check_mode: false

- name: Validate rpool
  ansible.builtin.assert:
    that:
      - zfs_rpool_health.stdout | trim == "ONLINE"
      - zfs_rpool_size.stdout | trim | int >= 1500 * 1024**3
    fail_msg: ZFS pool rpool must be ONLINE and at least 1500 GiB.

- name: Read rpool autotrim
  ansible.builtin.command:
    argv:
      - zpool
      - get
      - -H
      - -o
      - value
      - autotrim
      - rpool
  register: zfs_rpool_autotrim
  changed_when: false
  check_mode: false

- name: Enable rpool autotrim
  ansible.builtin.command:
    argv:
      - zpool
      - set
      - autotrim=on
      - rpool
  when: zfs_rpool_autotrim.stdout | trim != "on"
  changed_when: true

- name: Configure base ZFS datasets
  community.general.zfs:
    name: "rpool/{{ item.name }}"
    state: present
    extra_zfs_properties: "{{ item.properties }}"
  loop:
    - name: data
      properties:
        compression: lz4
        atime: "off"
        xattr: sa
    - name: swarm
      properties:
        compression: lz4
        atime: "off"
        xattr: sa
        snapdir: visible

- name: Configure Swarm service ZFS datasets
  community.general.zfs:
    name: "rpool/swarm/{{ item.name }}"
    state: present
    extra_zfs_properties: "{{ item.properties | default({}) }}"
  loop:
    - name: grafana
    - name: loki
    - name: paperless
      properties:
        "org.torsion.borgmatic:backup": auto
    - name: postgres
      properties:
        "org.torsion.borgmatic:backup": auto
    - name: victoriametrics
    - name: traefik
    - name: valkey
    - name: vaultwarden
      properties:
        "org.torsion.borgmatic:backup": auto
