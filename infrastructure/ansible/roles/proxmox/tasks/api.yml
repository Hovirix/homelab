# Behavior:
#
# ✓ Creates API roles if missing
# ✓ Updates API role privileges
# ✓ Creates API users if missing
# ✓ Assigns user ACLs
# ✓ Creates API tokens if missing
# ✓ Regenerates API tokens when requested
# ✓ Safe to run multiple times
# ✗ Does not update existing user properties
# ✗ ACL task always executes

- name: Ensure Proxmox API roles exist
  ansible.builtin.command:
    argv:
      - pveum
      - role
      - add
      - OpenTofuProv
      - --privs
      - >-
        Datastore.AllocateSpace Datastore.AllocateTemplate Datastore.Audit Sys.Audit VM.Allocate VM.Audit VM.Config.CDROM VM.Config.CPU VM.Config.Disk VM.Config.HWType VM.Config.Memory VM.Config.Network VM.Config.Options VM.PowerMgmt
  register: proxmox_api_role_add
  changed_when: proxmox_api_role_add.rc == 0
  failed_when:
    - proxmox_api_role_add.rc != 0
    - "'already exists' not in proxmox_api_role_add.stderr"
  run_once: true

- name: Update Proxmox API role privileges
  ansible.builtin.command:
    argv:
      - pveum
      - role
      - modify
      - OpenTofuProv
      - --privs
      - >-
        Datastore.AllocateSpace Datastore.AllocateTemplate Datastore.Audit Sys.Audit VM.Allocate VM.Audit VM.Config.CDROM VM.Config.CPU VM.Config.Disk VM.Config.HWType VM.Config.Memory VM.Config.Network VM.Config.Options VM.PowerMgmt
  changed_when: false
  run_once: true

- name: Ensure Proxmox API users exist
  ansible.builtin.command:
    argv:
      - pveum
      - user
      - add
      - opentofu@pve
      - -comment
      - OpenTofu lifecycle user
  register: proxmox_api_user_add
  changed_when: proxmox_api_user_add.rc == 0
  failed_when:
    - proxmox_api_user_add.rc != 0
    - "'already exists' not in proxmox_api_user_add.stderr"
  run_once: true

- name: Ensure Proxmox API user ACLs are applied
  ansible.builtin.command:
    argv:
      - pveum
      - acl
      - modify
      - /
      - --users
      - opentofu@pve
      - --roles
      - OpenTofuProv
  changed_when: false
  run_once: true

- name: Read Proxmox API tokens
  ansible.builtin.command:
    argv:
      - pveum
      - user
      - token
      - list
      - opentofu@pve
      - --output-format
      - json
  register: proxmox_api_token_list
  changed_when: false
  run_once: true

- name: Create missing Proxmox API token
  ansible.builtin.command:
    argv:
      - pveum
      - user
      - token
      - add
      - opentofu@pve
      - opentofu
      - --privsep
      - "0"
      - --comment
      - OpenTofu lifecycle token
      - --output-format
      - json
  register: proxmox_api_token_create
  changed_when: true
  when: "'opentofu' not in (proxmox_api_token_list.stdout | from_json | map(attribute='tokenid') | list)"
  notify: Print generated Proxmox API tokens to store in SOPS
  run_once: true
