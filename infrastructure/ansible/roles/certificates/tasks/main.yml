- name: Load Proxmox certificate secrets
  community.sops.load_vars:
    file: "{{ playbook_dir }}/../../../secrets/infrastructure.sops.yaml"
    name: infrastructure_secrets
  no_log: true
  run_once: true

- name: Create temporary ACME plugin credentials file
  ansible.builtin.tempfile:
    state: file
    suffix: -acme-plugin
  register: certificates_acme_plugin_file
  run_once: true

- block:
    - name: Verify the ACME token exists
      ansible.builtin.assert:
        that:
          - infrastructure_secrets.proxmox.acme_token | default('') | length > 0
      no_log: true
      run_once: true

    - name: Write ACME plugin credentials
      ansible.builtin.copy:
        dest: "{{ certificates_acme_plugin_file.path }}"
        content: |
          CF_Token={{ infrastructure_secrets.proxmox.acme_token }}
        mode: "0600"
      no_log: true
      run_once: true

    - name: Read Proxmox ACME account state
      ansible.builtin.command:
        argv:
          - pvenode
          - acme
          - account
          - info
          - default
          - --output-format
          - json
      register: certificates_acme_account_info
      changed_when: false
      failed_when: false
      run_once: true

    - name: Register the Proxmox ACME account
      ansible.builtin.command:
        argv:
          - pvenode
          - acme
          - account
          - register
          - default
          - "{{ proxmox_notifications_mailto }}"
          - --directory
          - https://acme-v02.api.letsencrypt.org/directory
        stdin: |
          y
      when:
        - certificates_acme_account_info.rc != 0
      changed_when: true
      run_once: true

    - name: Read Proxmox ACME plugin state
      ansible.builtin.command:
        argv:
          - pvenode
          - acme
          - plugin
          - config
          - cloudflare
          - --output-format
          - json
      register: certificates_acme_plugin_info
      changed_when: false
      failed_when: false
      run_once: true

    - name: Add the Proxmox ACME DNS plugin
      ansible.builtin.command:
        argv:
          - pvenode
          - acme
          - plugin
          - add
          - dns
          - cloudflare
          - --api
          - cf
          - --data
          - "{{ certificates_acme_plugin_file.path }}"
          - --validation-delay
          - "60"
      when:
        - certificates_acme_plugin_info.rc != 0
      changed_when: true
      run_once: true

  always:
    - name: Remove temporary ACME plugin credentials file
      ansible.builtin.file:
        path: "{{ certificates_acme_plugin_file.path }}"
        state: absent
      when: certificates_acme_plugin_file is defined
      run_once: true

- name: Configure the Proxmox ACME domain
  ansible.builtin.command:
    argv:
      - pvenode
      - config
      - set
      - --acme
      - account=default
      - -acmedomain0
      - "{{ proxmox_hostname }}.{{ proxmox_domain }},plugin=cloudflare"
  changed_when: false

- name: Order the Proxmox ACME certificate
  ansible.builtin.command:
    argv:
      - pvenode
      - acme
      - cert
      - order
      - --force
      - "1"
  changed_when: true
