- name: Derive desired storage values
  ansible.builtin.set_fact:
    node_storage_min_pool_size_bytes: "{{ (host.storage.min_pool_size_gib | int) * 1024 * 1024 * 1024 }}"
    node_storage_desired_autotrim: "{{ host.storage.autotrim | bool | ternary('on', 'off') }}"

- name: Read ZFS pool size
  ansible.builtin.command:
    argv:
      - zpool
      - list
      - -Hp
      - -o
      - size
      - "{{ host.storage.zpool }}"
  register: node_storage_pool_size
  changed_when: false

- name: Read ZFS pool health
  ansible.builtin.command:
    argv:
      - zpool
      - list
      - -H
      - -o
      - health
      - "{{ host.storage.zpool }}"
  register: node_storage_pool_health
  changed_when: false

- name: Read ZFS pool autotrim state
  ansible.builtin.command:
    argv:
      - zpool
      - get
      - -H
      - -o
      - value
      - autotrim
      - "{{ host.storage.zpool }}"
  register: node_storage_pool_autotrim
  changed_when: false

- name: Verify ZFS pool capacity and health
  ansible.builtin.assert:
    that:
      - node_storage_pool_health.stdout | trim == 'ONLINE'
      - (node_storage_pool_size.stdout | trim | int) >= (node_storage_min_pool_size_bytes | int)
    fail_msg: >-
      ZFS pool {{ host.storage.zpool }} is not healthy or is smaller than the expected minimum size. #magic___^_^___line
- name: Enable ZFS autotrim
  ansible.builtin.command:
    argv:
      - zpool
      - set
      - autotrim={{ node_storage_desired_autotrim }}
      - "{{ host.storage.zpool }}"
  when: node_storage_pool_autotrim.stdout | trim != node_storage_desired_autotrim
  changed_when: true

- name: Read ZFS dataset compression state
  ansible.builtin.command:
    argv:
      - zfs
      - get
      - -H
      - -o
      - value
      - compression
      - "{{ host.storage.dataset }}"
  register: node_storage_dataset_compression
  changed_when: false

- name: Read ZFS dataset atime state
  ansible.builtin.command:
    argv:
      - zfs
      - get
      - -H
      - -o
      - value
      - atime
      - "{{ host.storage.dataset }}"
  register: node_storage_dataset_atime
  changed_when: false

- name: Enable ZFS dataset compression
  ansible.builtin.command:
    argv:
      - zfs
      - set
      - compression={{ host.storage.dataset_properties.compression }}
      - "{{ host.storage.dataset }}"
  when: node_storage_dataset_compression.stdout | trim != host.storage.dataset_properties.compression
  changed_when: true

- name: Disable ZFS dataset atime updates
  ansible.builtin.command:
    argv:
      - zfs
      - set
      - atime={{ host.storage.dataset_properties.atime }}
      - "{{ host.storage.dataset }}"
  when: node_storage_dataset_atime.stdout | trim != host.storage.dataset_properties.atime
  changed_when: true
