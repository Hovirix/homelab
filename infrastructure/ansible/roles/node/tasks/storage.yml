- name: Derive desired storage values
  ansible.builtin.set_fact:
    node_storage_min_pool_size_bytes: "{{ 1500 * 1024 * 1024 * 1024 }}"

- name: Read ZFS pool size
  ansible.builtin.command:
    argv:
      - zpool
      - list
      - -Hp
      - -o
      - size
      - rpool
  register: node_storage_pool_size
  changed_when: false

- name: Read ZFS pool health
  ansible.builtin.command:
    argv:
      - zpool
      - list
      - -H
      - -o
      - health
      - rpool
  register: node_storage_pool_health
  changed_when: false

- name: Read ZFS pool autotrim state
  ansible.builtin.command:
    argv:
      - zpool
      - get
      - -H
      - -o
      - value
      - autotrim
      - rpool
  register: node_storage_pool_autotrim
  changed_when: false

- name: Verify ZFS pool capacity and health
  ansible.builtin.assert:
    that:
      - node_storage_pool_health.stdout | trim == 'ONLINE'
      - (node_storage_pool_size.stdout | trim | int) >= (node_storage_min_pool_size_bytes | int)
    fail_msg: ZFS pool rpool is not healthy or is smaller than the expected minimum size.

- name: Enable ZFS autotrim
  ansible.builtin.command:
    argv:
      - zpool
      - set
      - autotrim=on
      - rpool
  when: node_storage_pool_autotrim.stdout | trim != 'on'
  changed_when: true

- name: Read ZFS dataset compression state
  ansible.builtin.command:
    argv:
      - zfs
      - get
      - -H
      - -o
      - value
      - compression
      - rpool/data
  register: node_storage_dataset_compression
  changed_when: false

- name: Read ZFS dataset atime state
  ansible.builtin.command:
    argv:
      - zfs
      - get
      - -H
      - -o
      - value
      - atime
      - rpool/data
  register: node_storage_dataset_atime
  changed_when: false

- name: Enable ZFS dataset compression
  ansible.builtin.command:
    argv:
      - zfs
      - set
      - compression=lz4
      - rpool/data
  when: node_storage_dataset_compression.stdout | trim != 'lz4'
  changed_when: true

- name: Disable ZFS dataset atime updates
  ansible.builtin.command:
    argv:
      - zfs
      - set
      - atime=off
      - rpool/data
  when: node_storage_dataset_atime.stdout | trim != 'off'
  changed_when: true
