- name: Ensure SSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure SSH key-only access for root
  ansible.builtin.template:
    src: hxlab.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hxlab.conf
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: Reload sshd

- name: Configure root authorized keys
  ansible.posix.authorized_key:
    user: root
    key: "{{ node.ssh.root_authorized_keys | join('\n') }}"
    exclusive: true
    state: present
