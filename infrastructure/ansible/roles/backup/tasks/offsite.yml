- name: Install off-site backup tooling
  ansible.builtin.apt:
    name:
      - borgbackup
      - borgmatic
      - sshpass
    state: present

- name: Remove legacy off-site backup tooling
  ansible.builtin.apt:
    name:
      - rclone
      - restic
    state: absent

- name: Create Borgmatic configuration directory
  ansible.builtin.file:
    path: /etc/borgmatic
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write Storage Box password
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.env', 'HETZNER_STORAGE_BOX_PASSWORD') }}\n"
    dest: /etc/borgmatic/storagebox-password
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write Borg repository passphrase
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.env', 'BORG_PASSPHRASE') }}\n"
    dest: /etc/borgmatic/passphrase
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write Borgmatic configuration
  ansible.builtin.template:
    src: borgmatic.yaml.j2
    dest: /etc/borgmatic/config.yaml
    owner: root
    group: root
    mode: "0600"

- name: Remove legacy Restic configuration
  ansible.builtin.file:
    path: /etc/restic
    state: absent

- name: Check direct off-site backup timer
  ansible.builtin.stat:
    path: /etc/systemd/system/offsite-backup.timer
  register: backup_direct_timer

- name: Stop direct off-site backup timer
  ansible.builtin.systemd_service:
    name: offsite-backup.timer
    enabled: false
    state: stopped
  when: backup_direct_timer.stat.exists

- name: Remove direct off-site backup units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - offsite-backup.service
    - offsite-backup.timer

- name: Install off-site maintenance service
  ansible.builtin.template:
    src: backup-maintenance.service.j2
    dest: /etc/systemd/system/backup-maintenance.service
    owner: root
    group: root
    mode: "0644"

- name: Install off-site maintenance timer
  ansible.builtin.template:
    src: backup-maintenance.timer.j2
    dest: /etc/systemd/system/backup-maintenance.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable off-site maintenance timer
  ansible.builtin.systemd_service:
    name: backup-maintenance.timer
    enabled: true
    state: started
    daemon_reload: true
