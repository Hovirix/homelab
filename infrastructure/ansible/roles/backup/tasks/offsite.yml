- name: Install off-site backup tooling
  ansible.builtin.apt:
    name:
      - borgbackup
      - borgmatic
      - rsync
      - sshpass
    state: present

- name: Create Borgmatic configuration directory
  ansible.builtin.file:
    path: /etc/borgmatic
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write Storage Box password
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.env', 'HETZNER_STORAGE_BOX_PASSWORD') }}\n"
    dest: /etc/borgmatic/storagebox-password
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write Borg repository passphrase
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.env', 'BORG_PASSPHRASE') }}\n"
    dest: /etc/borgmatic/passphrase
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Read Borgmatic version
  ansible.builtin.command: borgmatic --version
  register: backup_borgmatic_version
  changed_when: false
  check_mode: false

- name: Write Borgmatic configuration
  ansible.builtin.template:
    src: borgmatic.yaml.j2
    dest: /etc/borgmatic/config.yaml
    owner: root
    group: root
    mode: "0600"

- name: Validate Borgmatic configuration
  ansible.builtin.command:
    argv:
      - borgmatic
      - config
      - validate
      - --config
      - /etc/borgmatic/config.yaml
  changed_when: false

- name: Check Borg repository
  ansible.builtin.command:
    argv:
      - borgmatic
      - repo-info
  register: backup_borg_repository
  changed_when: false
  failed_when: false

- name: Create Borg repository
  ansible.builtin.command:
    argv:
      - borgmatic
      - repo-create
      - --encryption
      - repokey
      - --make-parent-dirs
  when: backup_borg_repository.rc != 0
  changed_when: true

- name: Install Borgmatic scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - src: restore.sh.j2
      dest: /usr/local/sbin/restore

- name: Create isolated off-site restore directory
  ansible.builtin.file:
    path: /rpool/restore
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create Borgmatic service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/borgmatic.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Allow Borgmatic ZFS snapshot mounts
  ansible.builtin.template:
    src: borgmatic-zfs.conf.j2
    dest: /etc/systemd/system/borgmatic.service.d/zfs.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable distribution Borgmatic timer
  ansible.builtin.systemd_service:
    name: borgmatic.timer
    enabled: true
    state: started
    daemon_reload: true
