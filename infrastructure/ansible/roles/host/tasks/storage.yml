- name: Read ZFS pool size
  ansible.builtin.command:
    argv:
      - zpool
      - list
      - -Hp
      - -o
      - size
      - rpool
  register: host_storage_rpool_size
  changed_when: false

- name: Read ZFS pool health
  ansible.builtin.command:
    argv:
      - zpool
      - list
      - -H
      - -o
      - health
      - rpool
  register: host_storage_rpool_health
  changed_when: false

- name: Validate ZFS pool
  ansible.builtin.assert:
    that:
      - host_storage_rpool_health.stdout | trim == "ONLINE"
      - host_storage_rpool_size.stdout | trim | int >= 1500 * 1024**3
    fail_msg: >-
      ZFS pool rpool must be ONLINE and at least 1500 GiB.
- name: Read ZFS pool autotrim property
  ansible.builtin.command:
    argv:
      - zpool
      - get
      - -H
      - -o
      - value
      - autotrim
      - rpool
  register: host_storage_rpool_autotrim
  changed_when: false

- name: Enable ZFS pool autotrim
  ansible.builtin.command:
    argv:
      - zpool
      - set
      - autotrim=on
      - rpool
  when: host_storage_rpool_autotrim.stdout | trim != "on"
  changed_when: true

- name: Read ZFS dataset compression property
  ansible.builtin.command:
    argv:
      - zfs
      - get
      - -H
      - -o
      - value
      - compression
      - rpool/data
  register: host_storage_data_compression
  changed_when: false

- name: Enable ZFS dataset compression
  ansible.builtin.command:
    argv:
      - zfs
      - set
      - compression=lz4
      - rpool/data
  when: host_storage_data_compression.stdout | trim != "lz4"
  changed_when: true

- name: Read ZFS dataset atime property
  ansible.builtin.command:
    argv:
      - zfs
      - get
      - -H
      - -o
      - value
      - atime
      - rpool/data
  register: host_storage_data_atime
  changed_when: false

- name: Disable ZFS dataset atime updates
  ansible.builtin.command:
    argv:
      - zfs
      - set
      - atime=off
      - rpool/data
  when: host_storage_data_atime.stdout | trim != "off"
  changed_when: true

- name: Read ZFS dataset xattr property
  ansible.builtin.command:
    argv:
      - zfs
      - get
      - -H
      - -o
      - value
      - xattr
      - rpool/data
  register: host_storage_data_xattr
  changed_when: false

- name: Enable ZFS dataset xattr=sa
  ansible.builtin.command:
    argv:
      - zfs
      - set
      - xattr=sa
      - rpool/data
  when: host_storage_data_xattr.stdout | trim != "sa"
  changed_when: true
