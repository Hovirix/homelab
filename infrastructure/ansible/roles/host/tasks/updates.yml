- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Full-upgrade packages
  ansible.builtin.apt:
    upgrade: dist

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: host_updates_reboot_required

- name: Reboot if required
  ansible.builtin.reboot:
    reboot_timeout: 900
  when: host_updates_reboot_required.stat.exists

- name: Install scheduled host update script
  ansible.builtin.template:
    src: hxlab-host-update.sh.j2
    dest: /usr/local/sbin/hxlab-host-update
    owner: root
    group: root
    mode: "0755"

- name: Configure scheduled host update service
  ansible.builtin.template:
    src: hxlab-host-update.service.j2
    dest: /etc/systemd/system/hxlab-host-update.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Configure scheduled host update timer
  ansible.builtin.template:
    src: hxlab-host-update.timer.j2
    dest: /etc/systemd/system/hxlab-host-update.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable scheduled host updates
  ansible.builtin.systemd_service:
    name: hxlab-host-update.timer
    enabled: true
    state: started
