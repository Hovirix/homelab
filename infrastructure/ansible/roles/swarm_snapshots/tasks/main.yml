- name: Check Docker Swarm ZFS dataset
  ansible.builtin.command:
    argv:
      - zfs
      - list
      - -H
      - -o
      - name
      - rpool/swarm
  register: swarm_snapshots_zfs_dataset
  changed_when: false
  failed_when: false
  check_mode: false

- name: Verify Docker Swarm ZFS dataset exists
  ansible.builtin.assert:
    that:
      - swarm_snapshots_zfs_dataset.rc == 0
      - swarm_snapshots_zfs_dataset.stdout == "rpool/swarm"
    fail_msg: Expected ZFS dataset rpool/swarm is missing or could not be queried on {{ inventory_hostname }}; refusing to configure snapshots.

- name: Install Docker Swarm ZFS snapshot script
  ansible.builtin.template:
    src: swarm-zfs-snapshot.sh.j2
    dest: /usr/local/sbin/swarm-zfs-snapshot
    owner: root
    group: root
    mode: "0755"

- name: Install Docker Swarm ZFS snapshot service
  ansible.builtin.template:
    src: swarm-zfs-snapshot.service.j2
    dest: /etc/systemd/system/swarm-zfs-snapshot.service
    owner: root
    group: root
    mode: "0644"

- name: Install Docker Swarm ZFS snapshot timer
  ansible.builtin.template:
    src: swarm-zfs-snapshot.timer.j2
    dest: /etc/systemd/system/swarm-zfs-snapshot.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable and start Docker Swarm ZFS snapshot timer
  ansible.builtin.systemd_service:
    name: swarm-zfs-snapshot.timer
    enabled: true
    state: started
    daemon_reload: true
