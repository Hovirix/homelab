- name: Bootstrap Proxmox nodes
  hosts: nodes

  tasks:
    - name: Configure node repositories
      ansible.builtin.import_role:
        name: node
        tasks_from: repositories
      when: host.repositories.enabled | bool
      tags: [repositories]

    - name: Configure Proxmox repositories
      ansible.builtin.import_role:
        name: proxmox
        tasks_from: repositories
      when: host.repositories.enabled | bool
      tags: [repositories]

    - name: Configure node SSH
      ansible.builtin.import_role:
        name: node
        tasks_from: ssh
      when: host.ssh.enabled | bool
      tags: [ssh]
