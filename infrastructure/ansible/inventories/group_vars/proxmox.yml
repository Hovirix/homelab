proxmox:
  firewall:
    enabled: false

  certificates:
    enabled: true

  monitoring:
    enabled: false

  notifications:
    enabled: true
    target_name: hxlab-smtp
    matcher_name: hxlab-alerts
    mailto: homelab@hovirix.dev
    from_address: proxmox@hovirix.dev
    smtp_mode: starttls
    match_severity:
      - warning
      - error

  backup:
    enabled: false
    target_type: nfs
    retention:
      keep_daily: 7
      keep_weekly: 4
      keep_monthly: 12

  cluster:
    enabled: false
    planned_nodes:
      - pve1
      - pve2
      - pve3

  api:
    enabled: true
    roles:
      - name: OpenTofuProv
        privileges:
          - Datastore.AllocateSpace
          - Datastore.AllocateTemplate
          - Datastore.Audit
          - Sys.Audit
          - VM.Allocate
          - VM.Audit
          - VM.Config.CDROM
          - VM.Config.CPU
          - VM.Config.Disk
          - VM.Config.HWType
          - VM.Config.Memory
          - VM.Config.Network
          - VM.Config.Options
          - VM.PowerMgmt

    users:
      - userid: opentofu@pve
        comment: OpenTofu lifecycle user
        token:
          id: opentofu
          comment: OpenTofu lifecycle token
          privsep: false
          regenerate: false
        acl:
          path: /
          role: OpenTofuProv
