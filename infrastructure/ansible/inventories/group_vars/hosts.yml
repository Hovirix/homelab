host:
  system:
    enabled: true
    domain: home.hovirix.dev
    timezone: Etc/UTC

  repositories:
    enabled: true

  updates:
    enabled: true
    upgrade: true
    reboot: true

  ssh:
    enabled: true
    permit_root_login: prohibit-password
    root_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPTAawDXqCZS9g+Q+2/L8chJ5gD97WLaKKi6DG4nccuA openpgp:0x3602CA24

  wake_on_lan:
    enabled: true

  networking:
    enabled: true
    management:
      vlan: 20
      gateway: 10.20.0.1
    allowed_vlans:
      - id: 20
        name: management
      - id: 40
        name: kubernetes
      - id: 60
        name: air-gapped-vms

  storage:
    enabled: true
    zpool: rpool
    dataset: rpool/data
    min_pool_size_gib: 1500
    autotrim: true
    dataset_properties:
      compression: lz4
      atime: "off"

  kernel:
    enabled: true
    manage_cmdline: true
    iommu:
      enabled: true
    vfio:
      enabled: true
