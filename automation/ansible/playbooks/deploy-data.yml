---
- name: Deploy data workloads
  hosts: data
  become: true
  gather_facts: false

  pre_tasks:
    - name: Load postgres workload secrets
      community.sops.load_vars:
        file: "{{ data_secret_files.postgres }}"
        name: sops_postgres

    - name: Load valkey workload secrets
      community.sops.load_vars:
        file: "{{ data_secret_files.valkey }}"
        name: sops_valkey

  roles:
    - role: srv_data_disk
      vars:
        srv_layout: "{{ data_srv_layout }}"
        
    - role: podman_secrets
      vars:
        podman_secrets_items: "{{ data_podman_secrets }}"

    - role: quadlet
      vars:
        quadlet_dir: "{{ data_quadlet_dir }}"
        quadlet_workloads: "{{ data_quadlet }}"
